[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sentiment-keras"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["hydra-core>=1.3,<2", "keras>=3.0,<4", "numpy>=1.26", "pandas>=2.0,<3", "pandera[pandas]>=0.20,<1"]
[project.optional-dependencies]
dev = ["tensorflow>=2.16,<3", "pytest>=8", "jupyterlab>=4", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"

# =================================================================================================
# Prévision de consommation électrique multi-horizons avec scikit-learn
# -------------------------------------------------------------------------------------------------
# Pipeline de prévision de bout en bout (série quotidienne synthétique de consommation régionale -> expansion en couples origine/horizon avec contrat d'antériorité -> contrats Pandera -> features de décalage, de momentum et de thermo-sensibilité -> gradient boosting par histogrammes -> MAPE et MASE ventilés par horizon, backtest à origine glissante, comparaison aux références naïves, intervalles par quantiles de résidus, publication des sept prochains jours) pour une équipe Prévisions, entièrement piloté par Hydra et structuré en objets testables. La vérité terrain du jour cible (`load_mw`, `event_type`) est une métadonnée : elle sert à mesurer, jamais à entraîner.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ds-forecasting-sklearn
  name: electricity-load-forecasting-sklearn
  domain: data-science
  problem: time-series-forecasting
  stack: sklearn
  family: time_series_forecasting
  modality: tabular
  title: "Prévision de consommation électrique multi-horizons avec scikit-learn"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: forecasting
  primary: mape
  secondary:
    - smape
    - mase
    - mae
    - rmse
    - r2
  baseline: dummy
  direction: minimize
  min_primary: 4.0

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `time_series_forecasting` ----------------------------------
load_forecasting:
  horizon_column: horizon_days
  horizons:
  - 1
  - 2
  - 3
  - 7
  long_horizon: 7
  interval_level: 0.9
  interval_method: normalized_conformal
  interval_scale_column: load_last_observed
  backtest_folds: 5
  review_mape_threshold: 6.0
  sanity_max_relative_change: 0.35

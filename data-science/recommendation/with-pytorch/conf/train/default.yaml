# =================================================================================================
# Entraînement
# -------------------------------------------------------------------------------------------------
# Tous les paramètres de la boucle d'entraînement, du split, des callbacks et des artefacts
# produits. Rien n'est codé en dur dans `src/training/trainer.py`.
# =================================================================================================

split:
  test_size: 0.2
  val_size: 0.15
  stratify: false
  shuffle: false
  time_based: true
epochs: 40
batch_size: 256
learning_rate: 0.002
weight_decay: 0.0001
early_stopping:
  enabled: true
  monitor: val_loss
  patience: 6
  min_delta: 0.0
  mode: min
  restore_best: true
callbacks:
  logging_every: 1
  progress_bar: true
  metric_history: true
artifacts:
  model_file: model.pt
  pipeline_file: preprocessing.joblib
  feature_builder_file: feature_builder.joblib
  metrics_file: training_metrics.json
  model_card_file: model_card.json
  report_file: evaluation_report.md
  predictions_file: predictions.csv
cross_validation:
  enabled: false
  folds: 3
  strategy: kfold
  n_jobs: -1
n_jobs: -1

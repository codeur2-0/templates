# =================================================================================================
# Preprocessing & feature engineering
# -------------------------------------------------------------------------------------------------
# Décrit le pipeline appliqué aux données (nettoyage, encodage, scaling) ainsi que les features
# dérivées construites par `src/features/build_features.py`.
#
# Règle d'or : tout ce qui est **appris** sur les données (moyennes, médianes, catégories,
# encodeurs) doit être appris sur le train uniquement, puis appliqué au val/test. C'est le rôle
# du pipeline scikit-learn encapsulé dans `src/preprocessing/pipelines.py`.
# =================================================================================================

numeric:
  imputer: median
  imputer_fill_value: 0.0
  clip_outliers: false
  clip_quantiles:
  - 0.01
  - 0.99
  scaler: standard
  log1p_columns:
  - amount_eur
  - billing_shipping_distance_km
  - session_duration_sec
  - transactions_24h
categorical:
  imputer: most_frequent
  imputer_fill_value: unknown
  encoder: onehot
  handle_unknown: ignore
  min_frequency: 0.01
  max_categories: 12
features:
- type: boolean_flag
  name: country_mismatch
  column: shopper_country
  operator: ne
  value_column: billing_country
- type: boolean_flag
  name: fresh_device
  column: device_age_days
  operator: lt
  value: 2.0
- type: boolean_flag
  name: no_strong_auth
  column: three_ds_authenticated
  operator: eq
  value: 0
- type: bin
  name: amount_bucket
  column: amount_eur
  method: quantile
  bins: 5
- type: ratio
  name: merchants_per_transaction
  numerator: distinct_merchants_24h
  denominator: transactions_24h
  epsilon: 1.0
- type: group_stat
  name: amount_by_category
  group_by: merchant_category
  value_column: amount_eur
  agg: median
- type: datetime_parts
  name: occurred_parts
  column: occurred_at
  prefix: occurred
  parts:
  - hour
  - dayofweek
  - is_weekend
columns: {}
validation:
  raw: true
  processed: true
  inference: true
  strict: true
  lazy: false

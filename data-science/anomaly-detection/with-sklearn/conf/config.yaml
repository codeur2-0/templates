# =================================================================================================
# Détection de fraude sur transactions de paiement avec scikit-learn
# -------------------------------------------------------------------------------------------------
# Pipeline tabulaire de bout en bout (flux de paiements synthétique -> contrats Pandera -> feature engineering de vélocité et de contexte -> forêt d'isolation entraînée SANS étiquette -> PR AUC, lift et rappel au budget d'investigation, couverture par mode opératoire, scoring des nouvelles transactions avec décision, niveau de risque et raisons) pour une équipe Risques & Fraude, entièrement piloté par Hydra et structuré en objets testables. Les étiquettes de fraude (`is_fraud`, `fraud_scheme`) sont des métadonnées : elles servent à mesurer, jamais à entraîner.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ds-anomaly-sklearn
  name: payment-fraud-detection-sklearn
  domain: data-science
  problem: anomaly-detection
  stack: sklearn
  family: anomaly_detection
  modality: tabular
  title: "Détection de fraude sur transactions de paiement avec scikit-learn"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: anomaly
  primary: pr_auc
  secondary:
    - roc_auc
    - recall_at_budget
    - precision_at_budget
    - f1
    - precision
    - recall
  baseline: random_score
  direction: maximize
  min_primary: 0.42

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `anomaly_detection` ----------------------------------
fraud_detection:
  threshold: null
  budget_rate: 0.02
  review_risk_level: modéré

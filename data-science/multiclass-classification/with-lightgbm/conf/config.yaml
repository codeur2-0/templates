# =================================================================================================
# Diagnostic du mode de défaillance machine avec LightGBM
# -------------------------------------------------------------------------------------------------
# Pipeline multi-classes de bout en bout (alarmes machine synthétiques à physique explicite -> contrats Pandera -> features physiques déclarées en configuration -> boosting LightGBM leaf-wise avec early stopping natif -> évaluation face au plancher majoritaire, au routage actuel par code automate et au plafond oracle -> décision à coût minimal et revue experte) pour une équipe maintenance, entièrement piloté par Hydra et structuré en objets testables.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ds-multiclass-lightgbm
  name: machine-failure-diagnosis-lightgbm
  domain: data-science
  problem: multiclass-classification
  stack: lightgbm
  family: multiclass_classification
  modality: tabular
  title: "Diagnostic du mode de défaillance machine avec LightGBM"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: multiclass
  primary: f1_macro
  secondary:
    - balanced_accuracy
    - accuracy
    - mcc
    - log_loss
    - roc_auc_ovr
    - f1_weighted
    - precision_macro
    - recall_macro
  baseline: dummy
  direction: maximize
  min_primary: 0.55

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `multiclass_classification` ----------------------------------
diagnosis:
  class_order:
  - false_alarm
  - tool_wear
  - heat_dissipation
  - power_failure
  - overstrain
  - random_failure
  no_failure_class: false_alarm
  structural_classes:
  - random_failure
  alarm_code_column: alarm_code
  alarm_code_rule:
    E101: heat_dissipation
    E102: heat_dissipation
    E201: power_failure
    E202: power_failure
    E301: overstrain
    E302: tool_wear
    E901: false_alarm
  team_by_class:
    false_alarm: acquittement opérateur
    tool_wear: outillage
    heat_dissipation: thermique
    power_failure: électrique
    overstrain: mécanique
    random_failure: expertise maintenance
  costs:
    correct_intervention: 120.0
    correct_acknowledgement: 10.0
    wrong_team: 420.0
    missed_failure: 2500.0
    useless_dispatch: 150.0
    expert_review: 90.0
  confusion_notes:
    tool_wear / overstrain: 'un outil usé soumis à un fort couple franchit les deux
      seuils à la fois : seule la gamme de produit, qui fixe le seuil de surcharge,
      départage les deux lectures.'
    heat_dissipation / power_failure: les deux modes partagent la vitesse de broche
      basse ; l'écart de température process-air les distingue, la puissance seule
      ne suffit pas.
    false_alarm / tool_wear: 'un outil en fin de vie juste sous 200 min ressemble
      encore à un fonctionnement normal : la zone de bordure est bruitée par construction.'
    false_alarm / random_failure: 'une défaillance aléatoire n''a aucune signature
      capteur : elle ressemble à une fausse alarme, pour tout modèle comme pour l''oracle.'
    false_alarm / overstrain: 'une surcharge naissante (usure moyenne, couple modéré)
      reste sous le seuil de la gamme : les capteurs ne la distinguent pas encore
      d''un régime normal.'
    false_alarm / heat_dissipation: 'un refroidissement dégradé à vitesse normale
      réduit l''écart thermique sans franchir le seuil de vitesse : signal partiel.'
    false_alarm / power_failure: une puissance proche des bornes de la plage nominale
      laisse les deux lectures plausibles.
  review_threshold: 0.5
  objectives:
    f1_macro_min: 0.6
    gain_vs_alarm_code_min: 0.2
    per_class_recall_min: 0.55
    missed_failure_rate_max: 0.05
    ece_max: 0.08
    cost_reduction_vs_alarm_code_min: 0.4
    latency_ms_per_1000_max: 50.0

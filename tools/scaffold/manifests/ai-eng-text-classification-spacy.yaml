# ==============================================================================================
# ai-eng / text-classification / with-spacy_textcat
# ------------------------------------------------------------------------------------------------
# Cas d'usage hérité de `defaults/family/text_classification.yaml` (routage de tickets de support).
# Même corpus, mêmes splits, mêmes métriques que les variantes `with-tfidf_classifier` et
# `with-transformers` : c'est ce qui rend l'écart entre les trois variantes lisible. Ce manifeste ne
# décrit QUE ce qui change — un pipeline spaCy vierge et son composant `textcat`, entraînés sur le
# corpus, sans aucun modèle ni vecteur téléchargé.
#
# Le choix de l'architecture est rejouable : `python scripts/architecture_study.py` refait l'étude
# publiée ci-dessous (split de validation, protocole du projet, graines 42, 0, 1, 7 et 19).
# ==============================================================================================

key: ai-eng-text-classification-spacy
title: "Routage de tickets de support par un pipeline spaCy entraîné sur le corpus"
summary: >-
  Le même corpus que les variantes `with-tfidf_classifier` et `with-transformers` — 1 200
  tickets, six catégories, trois styles rédactionnels, une classe « autre » sans vocabulaire
  propre — confié à un pipeline spaCy **vierge** (`spacy.blank("fr")`, tokeniseur à règles, aucun
  modèle téléchargé) et à son composant `textcat`. Trois architectures natives ont été comparées sur
  le split de validation, au protocole du projet et sur cinq graines : le sac de n-grammes haché
  plafonne à 0,841 de F1 macro dès la septième époque, avec la même valeur sur les cinq graines ;
  l'encodeur de jetons réduit atteint au mieux 0,8177 (écart-type 0,011) et l'ensemble par défaut
  de spaCy 0,7882 (écart-type 0,069). L'avance du sac de n-grammes dépasse deux fois la dispersion
  de l'encodeur : c'est un résultat, et c'est lui qui est servi. Sur le split de test, il obtient
  0,8246 de F1 macro, derrière la variante lexicale (0,8408). Son trait distinctif est l'écart
  entre styles : 0,841 sur les tickets canoniques, 0,823 sur les paraphrases (le TF-IDF passe de
  0,926 à 0,735), mais 0,721 sur les tickets bruités, son point faible.

family: text_classification
domain: ai-eng
problem: text-classification
stack: spacy_textcat
project_slug: tickets-routage-spacy
package_name: tickets_routage_spacy

business:
  # Mesures du run de référence (`python -m src.main mode=all`, graine 42, 1 200 tickets, split de
  # test de 177 tickets) : mêmes lignes et même protocole que les deux autres variantes. La latence
  # et la durée d'ajustement dépendent de la charge de la machine : ce sont des ordres de grandeur.
  measured_results:
    - label: "F1 macro sur le split de test (six classes, chacune pesant pareil)"
      value: "0,8246"
    - label: "F1 macro en validation (le split qui a choisi l'architecture)"
      value: "0,8411"
    - label: "Trois architectures, meilleure F1 macro en validation (5 graines, lots de 64)"
      value: "sac 0,841 ± 0,000 / encodeur réduit 0,8177 ± 0,011 / ensemble 0,7882 ± 0,069"
    - label: "Exactitude / exactitude équilibrée / kappa de Cohen (test)"
      value: "0,8192 / 0,8194 / 0,7819"
    - label: "Segments canonique (93 tickets) / paraphrase (52) / bruité (32), F1 macro"
      value: "0,841 / 0,823 / 0,721"
    - label: "Écart canonique moins paraphrase (TF-IDF : 0,191)"
      value: "0,018"
    - label: "Confiance moyenne contre exactitude (écart de calibration)"
      value: "0,561 contre 0,819 (ECE 0,258) : modèle sous-confiant"
    - label: "Latence médiane / p95 d'une prédiction (selon la charge)"
      value: "0,2 à 0,6 ms / 0,5 à 1,4 ms"
    - label: "Ajustement du modèle servi (719 tickets, 8 époques, selon la charge)"
      value: "8 à 12 s"

model:
  display_name: "spaCy TextCatBOW (sac de n-grammes haché, couche linéaire) sur un pipeline vierge"
  algorithm: textcat_bow
  rationale: >-
    Le sac de n-grammes de spaCy hache les unigrammes et les bigrammes du ticket dans une table
    fixe et apprend une couche linéaire par classe : pas de vocabulaire à construire, pas de mot
    hors vocabulaire, et un ajustement d'une dizaine de secondes sur 719 tickets. Il a été choisi au
    terme d'une étude rejouable (`scripts/architecture_study.py`) faite au protocole du projet —
    lots de 64, défauts du registre pour chaque architecture, split de validation, cinq graines :
    il plafonne à 0,841 de F1 macro dès la septième époque, avec la même valeur sur les cinq
    graines, quand l'encodeur de jetons réduit atteint au mieux 0,8177 (écart-type 0,011). L'avance
    (0,023) dépasse deux fois la dispersion de l'encodeur : c'est un écart réel, pas un tirage. Le
    budget de huit époques se place sur ce plateau. La limite est mesurée : le modèle est
    **sous-confiant** — confiance moyenne 0,561 pour une exactitude de 0,819 en test, d'où un écart
    de calibration de 0,258 — et il ne faut donc pas router automatiquement sur sa confiance brute
    sans la recalibrer sur le split `calibration` que la famille réserve à cet usage. Chaque décision
    s'explique par occlusion : le jeton est retiré du ticket, et la baisse de probabilité est publiée.
  params:
    language: fr
  alternatives:
    - "`textcat_reduce` (encodeur de jetons : plongements hachés sur la forme normalisée, la forme en minuscules, le préfixe et le suffixe, convolution, moyenne et maximum) : 0,8177 ± 0,011 de F1 macro en validation au mieux (époque 9), soit 0,023 de moins que le sac de n-grammes ; c'est le choix à rejouer quand le corpus grossit, parce qu'il est le seul de la stack à lire les sous-mots."
    - "`textcat_ensemble` (architecture par défaut de spaCy, sac de n-grammes + encodeur) : 0,7882 ± 0,069 au mieux, et une dispersion entre graines dix fois plus forte que l'encodeur seul — sur 719 tickets, l'ensemble ne retrouve pas la qualité de sa meilleure composante. Résultat négatif publié, que le notebook 04 reproduit."
    - "Lots de 16 au lieu de 64 : 0,8342 ± 0,016 pour le sac de n-grammes — plus de pas d'optimisation, mais un résultat moins bon et dépendant de la graine."
    - "Variante `with-tfidf_classifier` : même corpus, mêmes splits ; meilleure moyenne de la famille (0,8408 en test), explicable terme à terme, mais très dépendante du vocabulaire (0,926 sur le canonique, 0,735 sur les paraphrases)."
    - "Variante `with-transformers` : encodeur appris sur le corpus, l'approche la plus forte sur les paraphrases d'après ses mesures publiées, au prix de minutes d'entraînement et d'une forte sur-confiance."
    - "Pipeline spaCy pré-entraîné (`fr_core_news_md`, vecteurs de mots) : hors périmètre, parce que le projet interdit tout téléchargement de modèle à l'exécution."

train:
  # Plateau atteint à la septième époque au protocole servi (voir l'étude ci-dessus).
  epochs: 8
  # Explicite : c'est la taille de lot de l'étude, et elle compte (0,841 en lots de 64 contre
  # 0,8342 ± 0,016 en lots de 16).
  batch_size: 64
  callbacks:
    progress_bar: false
  early_stopping:
    enabled: false

extras:
  data_conf:
    corpus:
      reference_date: "2025-03-03"
      style_shares:
        canonique: 0.5
        paraphrase: 0.3
        bruite: 0.2
      split_shares:
        train: 0.6
        val: 0.2
        calibration: 0.05
        test: 0.15
      # Formulations réservées aux splits d'évaluation, par couple (classe, style) : identiques à
      # celles des deux autres variantes, sans quoi elles ne mesureraient pas le même test.
      phrasing_holdout: 2
  model_conf:
    text_column: text
  root_conf:
    train:
      artifacts:
        model_file: classifier.joblib

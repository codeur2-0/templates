# ==============================================================================================
# data-science / regression / with-pytorch
# ------------------------------------------------------------------------------------------------
# Cas d'usage hérité de `defaults/family/regression.yaml` (estimation de prix immobilier, AVM).
# Ce manifeste ne décrit QUE ce qui change avec la stack : identité, modèle, budget d'entraînement.
# ==============================================================================================

key: ds-regression-pytorch
title: "Estimation du prix de vente immobilier (AVM) avec PyTorch"
summary: >-
  Pipeline tabulaire de bout en bout (données synthétiques -> contrats Pandera -> feature
  engineering -> réseau de neurones PyTorch entraîné par descente de gradient explicite ->
  analyse des résidus par segment) pour un modèle d'évaluation automatisée de prix immobilier,
  entièrement piloté par Hydra et structuré en objets testables. L'estimation publiée est une
  fourchette assortie d'un niveau de confiance.

family: regression
domain: data-science
problem: regression
stack: pytorch
project_slug: real-estate-avm-pytorch
package_name: avm_pytorch

# Budget d'entraînement : propre aux stacks itératives (époques, lots, taux d'apprentissage).
train:
  epochs: 45
  batch_size: 128
  learning_rate: 0.003
  weight_decay: 0.0001
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 8
    min_delta: 0.0
    mode: min
    # Restaure les poids de la meilleure époque (pas seulement un arrêt de la boucle).
    restore_best: true

model:
  display_name: "Réseau de neurones PyTorch (MLP)"
  algorithm: mlp
  rationale: >-
    Un perceptron multicouche montre ce que les boosters masquent : la boucle d'entraînement
    (lots, forward, perte, rétropropagation, pas d'optimiseur), la normalisation interne de la
    cible continue (indispensable quand on optimise un MSE sur des montants en euros), la
    régularisation par dropout et poids décroissant, l'ordonnancement du taux d'apprentissage et
    l'arrêt anticipé avec restauration du meilleur état. Sur des données tabulaires, le réseau
    n'est généralement pas le modèle le plus précis — c'est justement l'intérêt pédagogique : la
    comparaison avec scikit-learn, XGBoost et LightGBM sur les mêmes données et les mêmes
    métriques montre quand le deep learning est (et n'est pas) le bon choix.
  alternatives:
    - "linear : régression linéaire entraînée par gradient — baseline interprétable, même contrat"
    - "residual_mlp : MLP à connexions résiduelles, utile quand on empile les couches"
    - "autoencoder : reconstruction non supervisée, réservé à la détection d'anomalies"
  params:
    hidden_layers: [128, 64]
    dropout: 0.2
    activation: relu
    # Normalisation de lots : stabilise fortement l'apprentissage sur des features hétérogènes.
    batch_norm: true
    optimizer: adamw
    scheduler: cosine

extras:
  # Grille d'hyperparamètres explorée par le notebook 04 (le budget reste à 12 époques en notebook).
  notebook_param_grid:
    dropout: [0.1, 0.3]
    hidden_layers: [[64, 32], [128, 64]]
    learning_rate: [0.002, 0.008]
  # Taille des fixtures pytest (petit dataset = suite rapide).
  test_n_samples: 300
  model_conf:
    # CPU par défaut : déterminisme garanti et aucune dépendance matérielle.
    device: cpu
    # La validation croisée d'un réseau est coûteuse : elle est désactivée par défaut ici.
    cross_validation:
      enabled: false
      folds: 3
      strategy: kfold
  root_conf:
    estimation:
      tolerance_pct: 10.0            # fourchette publiée : +/- 10 % autour de l'estimation
      depth_column: recent_sales_1km # profondeur du marché -> niveau de confiance
      unit_column: surface_m2        # prix au m2 affiché à l'utilisateur
      min_market_depth: 10           # en dessous, le bien est orienté vers une revue humaine

learning_objectives:
  - "Écrire une boucle d'entraînement PyTorch explicite : DataLoader, forward, perte, backward, optimizer.step."
  - "Normaliser une cible continue en interne : pourquoi un MSE sur des montants en euros diverge et comment l'éviter."
  - "Comprendre ce que coûte le deep learning sur données tabulaires et quand lui préférer un booster."
  - "Régulariser un réseau : dropout, weight decay, batch norm, early stopping avec restauration du meilleur état."
  - "Ordonnancer le taux d'apprentissage (cosine, plateau) et lire son effet sur les courbes d'apprentissage."
  - "Garantir le déterminisme : graine avant initialisation, mélange généré par un Generator semé, CPU."
  - "Sauvegarder un checkpoint (poids + métadonnées, y compris les paramètres de cible) et le recharger sans pickler l'objet Python."

# ==============================================================================================
# data-science / classification / with-xgboost
# ------------------------------------------------------------------------------------------------
# Cas d'usage hérité de `defaults/family/binary_classification.yaml` (churn télécom).
# Ce manifeste ne décrit QUE ce qui change avec la stack : identité du projet et modèle.
# ==============================================================================================

key: ds-classification-xgboost
title: "Prédiction d'attrition client (churn télécom) avec XGBoost"
summary: >-
  Pipeline tabulaire de bout en bout (données synthétiques -> contrats Pandera -> feature
  engineering -> gradient boosting régulé XGBoost avec early stopping natif -> évaluation et
  analyse d'erreurs) pour un cas de churn télécom, entièrement piloté par Hydra et structuré
  en objets testables.

family: binary_classification
domain: data-science
problem: classification
stack: xgboost
project_slug: telecom-churn-xgboost
package_name: churn_xgboost

model:
  display_name: "Gradient boosting XGBoost"
  algorithm: xgboost
  rationale: >-
    XGBoost est la référence industrielle sur données tabulaires : le boosting régularisé (L1/L2,
    subsampling, shrinkage) capture les interactions du cas churn (contrat mensuel x jeune abonné x
    satisfaction basse) tout en restant maîtrisable grâce à l'early stopping natif sur un split de
    validation. L'importance de features au gain donne des facteurs explicatifs actionnables pour le
    CRM, et `scale_pos_weight` traite le déséquilibre de classes sans sur-échantillonnage.
  alternatives:
    - "xgboost_dart : dropout sur les arbres, régularise les gros ensembles (early stopping non supporté)"
    - "xgboost_linear : booster linéaire, vérifie qu'une part du signal est bien linéaire"
    - "logistic_regression : baseline interprétable, sensible au scaling et aux interactions"
    - "dummy : plancher à battre — un modèle qui ne le dépasse pas n'a aucune valeur"
  params:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.9
    colsample_bytree: 0.8
    min_child_weight: 3
    reg_lambda: 1.5
    reg_alpha: 0.0
    gamma: 0.0
    scale_pos_weight: auto
    importance_type: gain

extras:
  # Grille d'hyperparamètres explorée par le notebook 04 (petite : l'exécution reste < 1 min).
  notebook_param_grid:
    n_estimators: [200, 400]
    max_depth: [4, 8]
    learning_rate: [0.05, 0.12]
  # Taille des fixtures pytest (petit dataset = suite rapide).
  test_n_samples: 300
  model_conf:
    # Early stopping natif XGBoost : surveille `eval_metric` sur le split de validation.
    early_stopping_rounds: 40
    eval_metric: [logloss, auc]
    native_categorical: true
    cross_validation:
      enabled: true
      folds: 5
      strategy: stratified
  root_conf:
    decision:
      threshold: 0.5
      retention_cost_eur: 25.0
      customer_lifetime_value_eur: 1450.0

learning_objectives:
  - "Comprendre le gradient boosting : arbres séquentiels qui corrigent les résidus, shrinkage et régularisation."
  - "Utiliser l'early stopping natif (`eval_set` + `early_stopping_rounds`) sans réinventer la boucle d'entraînement."
  - "Régulariser un booster (max_depth, min_child_weight, subsample, colsample_bytree, reg_lambda, gamma)."
  - "Traiter un déséquilibre de classes avec `scale_pos_weight` plutôt qu'avec du sur-échantillonnage."
  - "Lire une importance de features au gain et connaître ses limites (biais vers les features à forte cardinalité)."
  - "Comparer les variantes de booster (gbtree, dart, gblinear) et des baselines honnêtes sur un même split."

# ==============================================================================================
# data-science / time-series-forecasting / with-lightgbm
# ------------------------------------------------------------------------------------------------
# Cas d'usage hérité de `defaults/family/time_series_forecasting.yaml` (prévision de la
# consommation électrique régionale pour un gestionnaire de réseau de distribution). Ce manifeste
# ne décrit QUE ce qui change avec la stack : identité du projet, modèle et point de fonctionnement.
# ==============================================================================================

key: ds-forecasting-lightgbm
title: "Prévision de consommation électrique multi-horizons avec LightGBM"
summary: >-
  Pipeline de prévision de bout en bout (série quotidienne synthétique de consommation régionale ->
  expansion en couples origine/horizon avec contrat d'antériorité -> contrats Pandera -> features de
  décalage, de momentum et de thermo-sensibilité -> boosting LightGBM avec arrêt anticipé sur la
  validation chronologique -> MAPE et MASE ventilés par horizon, backtest à origine glissante,
  comparaison aux références naïves, intervalles conformes normalisés, publication des sept
  prochains jours) pour une équipe Prévisions, entièrement piloté par Hydra.

family: time_series_forecasting
domain: data-science
problem: time-series-forecasting
stack: lightgbm
project_slug: electricity-load-forecasting-lightgbm
package_name: load_forecast_lightgbm

business:
  # Critères et mesures de CETTE stack (exécution de référence `make all`, graine 42, test
  # chronologique de 960 lignes) : les valeurs de la famille sont celles du projet scikit-learn.
  success_criteria:
    - "MAPE ≤ 4,0 % sur le split de test chronologique, tous horizons confondus. Mesuré : 3,521 % (J+1 3,355 | J+2 3,563 | J+3 3,520 | J+7 3,648), pour un plancher structurel de bruit à ~2,8 %."
    - "Le modèle doit battre le **naif saisonnier** (même jour de la semaine précédente) d'au moins 30 % en MAPE : c'est le seul seuil qui prouve une valeur ajoutée. Mesuré : +61,0 % (9,029 % -> 3,521 %)."
    - "MAPE ≤ 6,0 % à l'horizon J+7 : la dégradation avec l'horizon doit rester maîtrisée (le J+7 pilote les achats hebdomadaires). Mesuré : 3,648 %, soit 0,29 point au-dessus du J+1."
    - "MASE ≤ 0,75 : l'erreur doit être inférieure à celle du naif saisonnier pris comme référence d'échelle. Mesuré : 0,397."
    - "Biais moyen < 1,5 % et aucun mois dont le biais dépasse 4 % : une prévision systématiquement basse fait acheter trop cher en urgence. Mesuré : +0,689 % en moyenne, pire mois décembre à 2,956 %."
    - "Couverture de l'intervalle de prévision ≥ 85 % pour un niveau nominal de 90 %. Mesuré : 87,19 % avec le conformal normalisé."
    - "Reproductibilité : deux exécutions avec la même graine produisent exactement les mêmes métriques. Mesuré : dispersion inter-replis du backtest 0,270."
  constraints:
    - "Aucune donnée réelle de consommation : le dataset de ce dépôt est synthétique et hors ligne."
    - "Interdiction absolue de fuite temporelle : une feature ne peut utiliser que l'information disponible au matin de l'origine (historique) ou connue par avance (calendrier, prévision météo)."
    - "Le split d'évaluation est chronologique : jamais de mélange aléatoire, jamais de validation croisée aléatoire sur des séries temporelles."
    - "Le modèle doit s'exécuter sur CPU en moins de 5 secondes pour les 7 horizons d'une journée (contrainte d'astreinte). Mesuré : 0,11 à 0,30 s en moyenne sur 20 appels, sur un poste de développement Windows à charge variable — une marge d'un facteur 15 au moins."
    - "Les épisodes extrêmes (vague de froid, canicule, arrêt industriel) ne doivent pas être rognés : ce sont précisément les jours où la prévision vaut de l'argent."
  measured_results:
    - label: "MAPE global (test, 960 lignes)"
      value: "3,521 %"
    - label: "MAE"
      value: "94,0 MW"
    - label: "sMAPE / MASE / R²"
      value: "3,51 % / 0,397 / 0,960"
    - label: "Biais moyen (pire mois : décembre)"
      value: "+0,689 % (2,956 %)"
    - label: "MAPE du naif saisonnier -> gain du modèle"
      value: "9,029 % -> +61,0 %"
    - label: "Couverture d'intervalle (nominal 90 %)"
      value: "87,19 %"
    - label: "MAPE J+1 / J+2 / J+3 / J+7"
      value: "3,355 / 3,563 / 3,520 / 3,648 %"
    - label: "MAPE sur les 20 jours d'épisode extrême"
      value: "5,94 % (biais -5,74 %, limite documentée)"
    - label: "Dispersion inter-replis du backtest"
      value: "0,270"
    - label: "Features en entrée du modèle"
      value: "41 (32 colonnes brutes + encodage)"

model:
  display_name: "Gradient boosting LightGBM (LGBMRegressor)"
  algorithm: lightgbm
  rationale: >-
    LightGBM construit ses arbres feuille par feuille (leaf-wise) sur des histogrammes : à précision
    comparable, il est le plus rapide des boosters, ce qui compte pour un ré-entraînement quotidien
    et un backtest à cinq replis. `num_leaves` pilote directement la capacité ; le réglage retenu
    est **petit** (7 feuilles, 60 lignes minimum par feuille), parce qu'une croissance leaf-wise non
    bridée mémorise les pointes isolées d'une série bruitée. L'arrêt anticipé natif sur la
    validation chronologique fixe le nombre d'arbres. Limites : perte quadratique face à un métier
    qui pilote au MAPE, extrapolation médiocre hors du domaine vu, et aucun modèle linéaire dans la
    stack pour lire la thermo-sensibilité en MW par degré.
  alternatives:
    - "lightgbm_dart : dropout sur les arbres, régularise les gros ensembles, mais sans arrêt anticipé"
    - "lightgbm_goss : échantillonnage par gradient, utile sur de très gros volumes"
    - "référence naïve saisonnière : le seul adversaire qui compte — tout modèle qui ne la bat pas de 30 % en MAPE n'a aucune valeur opérationnelle"
  # Point retenu par un balayage sur le split chronologique de **validation** (jamais sur le test),
  # l'arrêt anticipé fixant le nombre d'arbres effectif. Protocole : notebook 04, section 5.
  params:
    n_estimators: 1500
    num_leaves: 7
    max_depth: -1
    learning_rate: 0.05
    min_child_samples: 60
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.5
    reg_lambda: 1.0
    reg_alpha: 0.0
    importance_type: gain

extras:
  # Grille d'hyperparamètres explorée par le notebook 04 (8 combinaisons), centrée sur le point
  # retenu : le notebook rejoue la décision au lieu de la paraphraser.
  notebook_param_grid:
    num_leaves: [7, 15]
    min_child_samples: [20, 60]
    colsample_bytree: [0.5, 0.8]
  # Taille des fixtures pytest : 400 lignes = 100 origines x 4 horizons.
  test_n_samples: 400
  # Réglages des notebooks propres à la stack (valeurs scikit-learn par défaut).
  notebook_forecasting:
    comparison: [lightgbm, lightgbm_dart, lightgbm_goss]
    linear_algorithm: null
    loss_param: objective
    losses: [regression, regression_l1]
    complexity_param: num_leaves
    complexity_values: [7, 15, 31, 63, 127]
    complexity_label: feuilles
    complexity_axis: nombre maximal de feuilles par arbre
    complexity_log2: true
    # Commentaires chiffrés des notebooks, écrits d'après les mesures de cette stack.
    prose:
      algorithms:
        - "À réglages par défaut, gbdt (4,03 %) et GOSS (3,94 %) sont à égalité au bruit près ; GOSS est un peu plus rapide, ce qui ne pèse qu'à gros volume."
        - "DART s'effondre (7,18 %) : sans arrêt anticipé et avec son dropout d'arbres, il ne converge pas à réglages par défaut — le régler exige plus d'itérations et un taux d'apprentissage adapté, pour un gain qui reste à démontrer."
        - "gbdt et GOSS battent le naif saisonnier (9,03 %) de plus de 50 % : c'est la preuve de valeur ajoutée qui justifie un modèle en exploitation."
        - "Ces chiffres sont à réglages par défaut : le modèle configuré, réglé sur la validation (section 5), descend à 3,40 % de MAPE de validation."
      thermo:
        - "LightGBM ne propose pas de booster linéaire : aucun coefficient n'est lisible en MW/°C dans cette stack, d'où la section sans objet."
        - "La lecture reste possible sans changer de stack : importance par permutation (notebook 06) pour savoir quelle variable compte, dépendance partielle pour le sens de l'effet."
        - "C'est un vrai critère de choix de stack, au même titre que le MAPE : un métier qui exige une thermo-sensibilité publiée en MW/°C a besoin d'un modèle linéaire à côté du booster (Ridge en scikit-learn, booster linéaire en XGBoost)."
      grid:
        - "`colsample_bytree=0.5` gagne dans toutes les configurations de la grille, comme en XGBoost et en scikit-learn : sans lui, les colonnes redondantes concentreraient les découpes."
        - "`min_child_samples=60` bride la croissance leaf-wise : à 7 feuilles, il gagne 0,2 point de MAPE de validation sur 20."
        - "À 15 feuilles, le MAPE d'entraînement tombe sous 0,8 % pour une validation moins bonne : le surplus de capacité sert à mémoriser."
        - "Le point retenu (7 feuilles, 60 lignes minimum par feuille, `colsample_bytree=0.5`) est le meilleur de la grille et celui dont l'écart d'apprentissage est le plus faible (2,0 points)."
      loss:
        - "La perte quadratique (`regression`) gagne sur les **cinq** critères : MAPE 3,45 % contre 3,51 %, MAE 92 contre 94 MW, RMSE 119 contre 120 MW, biais +0,57 % contre +0,99 %, P95 8,3 % contre 8,7 %."
        - "L'écart de MAPE est plus faible qu'en XGBoost (0,05 point contre 0,21) : le choix de la perte pèse peu ici, mais il penche toujours du même côté."
        - "La perte absolue (`regression_l1`) prévoit une médiane et gonfle le biais positif (+0,99 %) : elle sur-engage la production sans rien gagner sur les pointes."
        - "Le choix configuré (`regression`, défaut de LightGBM) est donc un arbitrage mesuré, identique à celui des autres stacks de la famille."
      overfit:
        - "De 7 à 31 feuilles, le MAPE d'entraînement passe de 1,39 % à 0,35 % pendant que la validation se dégrade de 3,40 % à 3,70 % : la divergence est le surapprentissage."
        - "Au-delà de 63 feuilles plus rien ne bouge : `min_child_samples=60` empêche déjà l'arbre d'utiliser les feuilles supplémentaires — les deux garde-fous se relaient."
        - "Le test suit la validation de près (3,45 % à 7 feuilles), signe que le split de test ne contient pas de régime absent de la validation."
  # Options du générateur synthétique, exposées dans `conf/data/default.yaml` et transmises par
  # `SyntheticDataGenerator.from_config` (aucune valeur codée en dur dans le code).
  data_conf:
    horizons: [1, 2, 3, 7]
    start_date: "2021-01-01"
    warmup_days: 40
    base_load_mw: 2100.0
    annual_amplitude: 0.18
    trend_per_year: -0.008
    heat_gradient: 0.035
    # Gradient de climatisation trois fois plus faible que le gradient de chauffe : le parc
    # français est peu climatisé. Cette asymétrie est réelle, mesurable, et elle explique
    # pourquoi une canicule coûte moins cher en erreur de prévision qu'une vague de froid.
    cool_gradient: 0.012
    holiday_drop: 0.13
    school_holiday_lift: 0.015
    noise_sigma: 0.022
    noise_ar: 0.60
    forecast_error_j1: 0.35
    forecast_error_growth: 0.14
    missing_temperature_rate: 0.03
    # Jours d'épisode sur toute la période simulée (~3,3 ans) : assez pour que l'analyse d'erreur
    # par régime dispose de quelques dizaines de jours cibles, pas assez pour que le modèle les
    # apprenne par coeur — c'est exactement la situation réelle d'un gestionnaire de réseau.
    cold_snap_days: 18
    heatwave_days: 18
    shutdown_days: 9
  # Critères de succès du cas d'usage, lus par le rapport d'évaluation.
  #
  # Calibration : les MAPE sont exprimés en pourcents, comme les métriques `mape` et `smape` du
  # registre. Le plancher structurel est d'environ 1,5 % (bruit AR(1) de 2,2 % plus l'erreur de
  # prévision météo) : un MAPE proche de 0 signerait une fuite temporelle, pas une performance.
  # Les seuils sont calibrés sur les mesures réelles de ce générateur (seed 42, 4 800 lignes) et
  # laissent une marge supérieure à la dispersion entre graines. Un seuil non atteint n'est pas
  # caché : le verdict du rapport l'affiche en échec, avec la valeur mesurée.
  # Unité : tout ce qui est un taux est exprimé en **pourcent** (30.0 et non 0.30), parce que les
  # métriques du rapport le sont aussi ; `mase_max` est un ratio sans unité. Les deux clés de taux
  # dont la valeur documentée est ≥ 10 sont converties automatiquement si elles sont déclarées en
  # fraction, avec un avertissement dans le journal.
  quality:
    # MAPE global sur le test. Plancher structurel ~2,8 % (bruit AR(1) multiplicatif de 2,75 %
    # d'écart-type, plus l'erreur de prévision météo) : ce seuil est donc atteignable sans fuite, et
    # un MAPE proche de 0 signerait une fuite temporelle et non une performance.
    mape_max: 4.0
    # L'horizon long est le plus difficile (prévision météo dégradée, information d'origine plus
    # ancienne) : on tolère 1,5 fois le seuil global.
    mape_long_horizon_max: 6.0
    mase_max: 0.75
    # Gain minimal sur la référence naïve saisonnière : en dessous de 30 %, le modèle ne justifie
    # pas sa complexité d'exploitation. Mesuré : ~55 %.
    improvement_vs_naive_min: 30.0
    # Biais moyen (surestimation ou sous-estimation systématique), en % du niveau de consommation.
    bias_max: 1.5
    # Couverture réalisée de l'intervalle publié, dont le niveau nominal est 90 %. Le seuil est
    # volontairement sous le nominal : la période de test contient une vague de froid absente de la
    # fenêtre de calibration, et aucune calibration honnête ne peut couvrir un régime qu'elle n'a
    # jamais vu. Le rapport ventile donc la couverture entre jours calmes (~89 %, proche du nominal)
    # et jours de régime extrême (très basse), et c'est cette ventilation qui est exploitable.
    interval_coverage_min: 82.0
    # Écart-type du MAPE entre les replis du backtest à origine glissante : mesure la stabilité
    # opérationnelle, pas la performance.
    backtest_spread_max: 2.0
  model_conf:
    early_stopping_rounds: 40
    eval_metric: l2
    native_categorical: true
    # Aucune validation croisée aléatoire : sur une série temporelle elle mélange les époques et
    # produit un score optimiste. La validation temporelle est portée par le backtest à origine
    # glissante (`src/evaluation/evaluator.py`), qui respecte l'antériorité de l'information.
    cross_validation:
      enabled: false
      folds: 3
      strategy: kfold
  root_conf:
    load_forecasting:
      # Colonne portant l'horizon de prévision. Lue par l'évaluateur (ventilation par horizon) et
      # par le prédicteur (intervalle et erreur attendue) : aucun nom de colonne n'est codé en dur.
      horizon_column: horizon_days
      # Horizons publiés chaque matin. Doivent rester un sous-ensemble des horizons du générateur :
      # un horizon jamais vu en entraînement serait de l'extrapolation pure.
      horizons: [1, 2, 3, 7]
      # Horizon considéré comme « long » dans les rapports et les alertes de dérive.
      long_horizon: 7
      # Niveau nominal de l'intervalle publié avec la prévision ponctuelle.
      interval_level: 0.90
      # Construction de l'intervalle : prédiction conforme **normalisée**, par horizon. Les scores
      # de calibration sont les résidus absolus de la validation divisés par une échelle connue à
      # l'origine. Deux raisons à ce choix, mesurées sur ce jeu :
      #   - les résidus sont autocorrélés et leur dispersion croît avec l'horizon, donc une
      #     hypothèse gaussienne globale donne un intervalle trop étroit au J+7 et trop large au J+1 ;
      #   - le bruit de la série est multiplicatif, donc la dispersion des résidus est proportionnelle
      #     au niveau de consommation. Un intervalle calibré sur une fenêtre estivale calme est deux
      #     fois trop étroit pour une pointe hivernale : normaliser par la dernière valeur connue
      #     fait passer la couverture réalisée de 73 % à 85 %.
      interval_method: normalized_conformal
      # Échelle de dispersion de l'intervalle normalisé. Doit être connue à l'origine (jamais la
      # vérité du jour cible) et proportionnelle à la dispersion des résidus.
      interval_scale_column: load_last_observed
      # Nombre de replis du backtest à origine glissante (fenêtre d'entraînement étendue à chaque
      # repli, jamais mélangée : c'est l'équivalent temporel d'une validation croisée).
      backtest_folds: 5
      # Au-delà de ce MAPE par horizon (en pourcents), la prévision est publiée avec l'indicateur
      # « à revoir par un analyste » plutôt qu'engagée telle quelle.
      review_mape_threshold: 6.0
      # Écart relatif à la prévision au-delà duquel une publication est signalée comme atypique
      # (garde-fou contre un modèle qui décroche après une rupture de régime).
      sanity_max_relative_change: 0.35

learning_objectives:
  - "Comprendre la croissance leaf-wise et la brider par `num_leaves` et `min_child_samples` sur une série bruitée."
  - "Armer l'arrêt anticipé natif d'un booster sur une validation **chronologique**, jamais aléatoire."
  - "Comparer gbdt, DART et GOSS à protocole identique, et lire le coût d'entraînement à côté du score."
  - "Situer le modèle face aux références naïves et publier un intervalle dont la couverture est mesurée."

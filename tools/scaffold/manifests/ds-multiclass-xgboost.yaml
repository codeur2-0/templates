# ==============================================================================================
# data-science / multiclass-classification / with-xgboost
# ------------------------------------------------------------------------------------------------
# Cas d'usage hérité de `defaults/family/multiclass_classification.yaml` (diagnostic du mode de
# défaillance d'une machine d'usinage). Ce manifeste ne décrit QUE ce qui change avec la stack.
# ==============================================================================================

key: ds-multiclass-xgboost
title: "Diagnostic du mode de défaillance machine avec XGBoost"
summary: >-
  Pipeline multi-classes de bout en bout (alarmes machine synthétiques à physique explicite ->
  contrats Pandera -> features physiques déclarées en configuration -> boosting XGBoost régularisé
  avec early stopping natif et encodage explicite des libellés -> évaluation face au plancher
  majoritaire, au routage actuel par code automate et au plafond oracle -> décision à coût
  minimal et revue experte) pour une équipe maintenance, entièrement piloté par Hydra.

family: multiclass_classification
domain: data-science
problem: multiclass-classification
stack: xgboost
project_slug: machine-failure-diagnosis-xgboost
package_name: failure_diagnosis_xgboost

business:
  # Exécution de référence (`make all`, graine 42, split de test de 1 200 alarmes). Les valeurs
  # sont déterministes ; seule la latence dépend de la machine.
  measured_results:
    - label: "Macro-F1 (test)"
      value: "0,676 (routage actuel 0,375 ; plafond oracle 0,679)"
    - label: "Accuracy / balanced accuracy / MCC"
      value: "0,783 / 0,672 / 0,732"
    - label: "Log loss / AUC un-contre-tous / ECE"
      value: "0,669 / 0,912 / 0,027"
    - label: "Coût par alarme : argmax / coût minimal / routage actuel"
      value: "478 / 167 / 428 EUR"
    - label: "Pannes réelles acquittées : argmax / coût minimal / routage actuel"
      value: "22,6 % / 0,0 % / 14,4 %"
    - label: "Rappel le plus faible d'un mode prédictible (overstrain)"
      value: "0,621"
    - label: "Rappel de random_failure (modèle / oracle)"
      value: "0,000 / 0,000"
    - label: "Latence pour 1 000 alarmes"
      value: "7 ms"
    - label: "Verdict contractuel"
      value: "7/7 objectifs atteints"

model:
  display_name: "Gradient boosting XGBoost (multi-classes)"
  algorithm: xgboost
  rationale: >-
    XGBoost optimise la log loss multi-classes (`multi:softprob`) avec un boosting régularisé
    (L2, sous-échantillonnage, shrinkage) et s'arrête seul sur la validation. Il n'accepte que des
    classes codées 0..K-1 : le modèle encode les libellés à l'entraînement et les décode à la
    prédiction, si bien que le reste du projet ne voit jamais que « tool_wear » ou
    « heat_dissipation ». Profondeur modeste (4) pour garder des probabilités fidèles ; aucune
    pondération de classes, l'asymétrie des erreurs étant portée par la matrice de coûts.
  alternatives:
    - "xgboost_dart : dropout sur les arbres, régularise les gros ensembles (early stopping non supporté)"
    - "xgboost_linear : booster linéaire, vérifie la part linéaire du signal"
    - "logistic_regression : baseline linéaire et bien calibrée, aveugle aux seuils sans features physiques"
  params:
    n_estimators: 400
    max_depth: 4
    learning_rate: 0.06
    subsample: 0.9
    colsample_bytree: 0.8
    min_child_weight: 3
    reg_lambda: 1.5
    reg_alpha: 0.0
    gamma: 0.0
    importance_type: gain

extras:
  # Grille explorée par le notebook 04 (8 combinaisons).
  notebook_param_grid:
    max_depth: [3, 5]
    learning_rate: [0.04, 0.08]
    min_child_weight: [1, 5]
  test_n_samples: 600
  model_conf:
    early_stopping_rounds: 30
    eval_metric: mlogloss
    native_categorical: true
    cross_validation:
      enabled: true
      folds: 5
      strategy: stratified

learning_objectives:
  - "Encoder et décoder des libellés de classes pour un framework qui n'accepte que des entiers 0..K-1."
  - "Armer l'early stopping natif sur la log loss multi-classes (`mlogloss`)."
  - "Régulariser un booster pour préserver la calibration dont dépend la décision à coût minimal."
  - "Situer un modèle entre le plancher majoritaire, la règle métier actuelle et le plafond atteignable."

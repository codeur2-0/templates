# ==============================================================================================
# ai-eng / named-entity-recognition / with-spacy
# ------------------------------------------------------------------------------------------------
# Cas d'usage hérité de `defaults/family/named_entity_recognition.yaml` (extraction des entités d'un
# message de service client). Ce manifeste ne décrit QUE ce qui change avec la stack : l'identité du
# projet, l'algorithme servi et les réglages de la boucle d'entraînement. Le corpus, les cinq types
# d'entités, les surfaces réservées et la métrique principale sont ceux de la famille — c'est ce qui
# rend les scores comparables à la référence publiée avec le corpus.
#
# Réglages mesurés, pas supposés : une grille de cinq configurations a été entraînée sur le split
# d'entraînement (720 messages) et évaluée sur la validation avant d'écrire ce manifeste —
# 20 époques / 8 lots / dropout 0,20 / lr 0,001 : 0,8900 de F1 macro ; 30 / 8 / 0,35 / 0,001 :
# 0,9065 ; **30 / 8 / 0,20 / 0,0007 : 0,9224** ; 30 / 16 / 0,20 / 0,001 : 0,8691 ; 40 / 8 / 0,20 /
# 0,001 : 0,9215. Le budget de 40 époques égale le budget de 30 avec un taux réduit (0,9215 contre
# 0,9224) pour 135 s au lieu de 95 s : le projet sert le réglage **le moins coûteux à qualité
# égale**. La grille est reproduite par le notebook 04, sur un corpus réduit.
# ==============================================================================================

key: ai-eng-named-entity-recognition-spacy
title: "Extraction d'entités nommées par spaCy — le tagger appris, corroboré par des règles"
summary: >-
  Cinq types d'entités (produit, référence de commande, montant, date, transporteur), 1 200 messages
  de service client synthétiques annotés au caractère, écrits dans deux styles rédactionnels — 55 %
  rédigés (« CMD-1234 », « 12 mars 2025 ») et 45 % abrégés (« cmd 1234 », « 12/03/2025 »). Le
  pipeline spaCy est entraîné **sur le corpus** (`spacy.blank`, aucun modèle pré-entraîné
  téléchargé) et servi en **hybride** : un tagger à transitions décide, une couche de règles
  déclarées (motifs de référence, de montant et de date + index de surfaces appris sur le train)
  corrobore et comble les trous. Cette couche de règles est la référence explicable du projet : elle
  est chiffrée sur le même split de test, et l'écart avec le tagger est publié plutôt que supposé.
  Les surfaces de produits et de transporteurs des splits d'évaluation sont **réservées** — jamais
  vues à l'entraînement — donc le projet mesure ce qu'un modèle apprend de la *forme* d'un nom au
  lieu de récompenser une liste. Chaque mention publiée porte sa provenance et une confiance dont la
  précision est mesurée par niveau.

family: named_entity_recognition
domain: ai-eng
problem: named-entity-recognition
stack: spacy
project_slug: messages-extraction-entites-spacy
package_name: messages_extraction_entites_spacy

business:
  # Mesures reproductibles : `python -m src.main mode=all` (graine 42, 1 200 messages, split de test
  # de 180 messages). Le tagger est entraîné 30 époques sur 720 messages ; les valeurs ci-dessous
  # sortent des artefacts du run de référence et sont rejouées à l'identique par le pipeline.
  measured_results:
    - label: "F1 au niveau entité, micro, sur le split de test (seuil 0,7 ; plancher trivial 0,0)"
      value: "0,9340"
    - label: "Précision / rappel au niveau entité (bornes exactes exigées)"
      value: "0,9521 / 0,9167"
    - label: "F1 macro (les cinq types comptent pareil) / F1 partielle (bornes tolérées)"
      value: "0,9239 / 0,9735"
    - label: "Référence « couche de règles » sur le même test (surfaces du train uniquement)"
      value: "0,8710"
    - label: "Rappel sur les surfaces réservées aux splits d'évaluation / déjà vues au train"
      value: "0,6056 / 1,0000"
    - label: "Confiance moyenne publiée (écart sur les mentions correctes)"
      value: "0,8423 (0,1396)"
    - label: "Erreurs classées au test (inventée / bornes / manquée)"
      value: "5 / 20 / 0"
    - label: "Type le plus difficile (F1 au niveau entité) / le plus facile"
      value: "transporteur 0,713 / commande, date, montant 1,000"
    - label: "Surfaces réservées au test : produits et transporteurs jamais vus à l'entraînement"
      value: "12 / 4"

model:
  display_name: "Tagger d'entités spaCy entraîné sur le corpus (tok2vec + transitions), hybride"
  algorithm: hybrid
  rationale: >-
    Le tagger est un pipeline `spacy.blank("fr")` entraîné **sur le corpus** : le tok2vec et le
    composant `ner` (un classifieur à transitions) apprennent sur les 720 messages du split
    d'entraînement, sans aucun poids pré-entraîné, donc sans dépendance réseau. C'est le seul modèle
    du projet capable de généraliser au-delà du vocabulaire vu : les surfaces réservées des splits
    d'évaluation ne peuvent pas être retrouvées par une liste, mais une partie est retrouvée par la
    *forme* des noms — et l'écart est mesuré. Le modèle servi est hybride (`algorithm: hybrid`) : le
    tagger décide, la couche de règles corrobore et comble les trous. Les règles n'apportent rien en
    F1 sur ce corpus (le tagger les couvre), et c'est publié ; en revanche elles donnent à chaque
    mention une **provenance** et une **confiance** — le taux de recouvrement entre le span prédit et
    la couche de règles, dont la précision est mesurée par niveau dans le rapport d'évaluation. Un
    tagger à transitions n'expose pas de probabilité par mention : publier une fausse probabilité
    serait pire que publier une mesure de corroboration documentée.
  params:
    training:
      dropout: 0.2
  alternatives:
    - "`gazetteer` : la couche de règles seule (motifs déclarés + surfaces vues au train), sans apprentissage — le plancher explicable, mesuré sur le même split de test."
    - "`tagger` : le tagger seul, sans règles ; l'écart avec l'hybride est publié (il est nul en F1 macro sur ce corpus)."
    - "Modèle pré-entraîné téléchargé (`fr_core_news_md`) : hors périmètre — le projet n'autorise aucune dépendance réseau à l'exécution."
    - "Modèle à base de transformeurs (`camembert-base`) : hors périmètre pour la même raison, et 719 messages d'entraînement ne justifient pas l'empreinte mémoire."

train:
  epochs: 30
  batch_size: 8
  learning_rate: 0.0007
  callbacks:
    progress_bar: false
  early_stopping:
    enabled: false

extras:
  data_conf:
    corpus:
      reference_date: "2025-03-03"
      style_shares:
        redige: 0.55
        abrege: 0.45
      split_shares:
        train: 0.6
        val: 0.2
        calibration: 0.05
        test: 0.15
      # Part des mentions d'évaluation qui peuvent tirer une surface réservée, et probabilité de la
      # tirer : les deux sont déclarées, donc l'écart train/test est reproductible.
      part_reservee: 0.75
      reserved_draw: 0.65
  model_conf:
    text_column: text
  root_conf:
    train:
      artifacts:
        # L'artefact du modèle spaCy est un **répertoire** : `nlp.to_disk` écrit le pipeline, ses
        # poids et son vocabulaire, et le projet y ajoute l'index de règles appris sur le train.
        model_file: tagger

# ==============================================================================================
# data-science / regression / with-keras
# ------------------------------------------------------------------------------------------------
# Cas d'usage hérité de `defaults/family/regression.yaml` (estimation de prix immobilier, AVM).
# Ce manifeste ne décrit QUE ce qui change avec la stack : identité, modèle, budget d'entraînement.
# ==============================================================================================

key: ds-regression-keras
title: "Estimation du prix de vente immobilier (AVM) avec Keras (API fonctionnelle)"
summary: >-
  Pipeline tabulaire de bout en bout (données synthétiques -> contrats Pandera -> feature
  engineering -> réseau de neurones Keras déclaré puis compilé (API fonctionnelle) -> analyse des résidus par segment) pour un modèle d'évaluation
  automatisée de prix immobilier, entièrement piloté par Hydra et structuré en objets testables.
  L'estimation publiée est une fourchette assortie d'un niveau de confiance.

family: regression
domain: data-science
problem: regression
stack: keras
project_slug: real-estate-avm-keras
package_name: avm_keras

# Budget d'entraînement : propre aux stacks itératives (époques, lots, taux d'apprentissage).
train:
  epochs: 45
  batch_size: 128
  learning_rate: 0.003
  weight_decay: 0.0001
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 8
    min_delta: 0.0
    mode: min
    # Keras restaure nativement les poids de la meilleure époque (`restore_best_weights`).
    restore_best: true

model:
  display_name: "Réseau de neurones Keras (API fonctionnelle)"
  algorithm: mlp
  rationale: >-
    L'API fonctionnelle montre l'autre façon de faire du deep learning : le graphe est **déclaré**
    (entrées -> couches -> modèle), puis **compilé** avec son optimiseur, sa perte (erreur
    quadratique moyenne sur une cible continue normalisée en interne) et ses métriques, avant que
    `fit` ne prenne en charge la boucle d'entraînement. On y gagne l'inspection du réseau, la
    sérialisation native (.keras) et les callbacks éprouvés (EarlyStopping, ReduceLROnPlateau,
    TerminateOnNaN) ; on y perd la visibilité fine sur chaque pas de gradient, que la stack
    PyTorch du même cas d'usage met au contraire en évidence.
  alternatives:
    - "linear : régression linéaire compilée — baseline interprétable, même contrat"
    - "residual_mlp : MLP à blocs résiduels, utile quand on empile les couches"
    - "autoencoder : reconstruction non supervisée, réservé à la détection d'anomalies"
  params:
    hidden_layers: [128, 64]
    dropout: 0.2
    activation: relu
    # Normalisation de lots : stabilise fortement l'apprentissage sur des features hétérogènes.
    batch_norm: true
    optimizer: adamw
    scheduler: cosine

extras:
  # Grille d'hyperparamètres explorée par le notebook 04 (le budget reste à 12 époques en notebook).
  notebook_param_grid:
    dropout: [0.1, 0.3]
    hidden_layers: [[64, 32], [128, 64]]
    learning_rate: [0.002, 0.008]
  # Taille des fixtures pytest (petit dataset = suite rapide).
  test_n_samples: 300
  model_conf:
    # Déterminisme des opérations TensorFlow : reproductibilité bit à bit, léger surcoût.
    deterministic: true
    # La validation croisée d'un réseau est coûteuse : elle est désactivée par défaut ici.
    cross_validation:
      enabled: false
      folds: 3
      # Une cible continue ne se stratifie pas : plis aléatoires.
      strategy: kfold
  root_conf:
    estimation:
      tolerance_pct: 10.0            # fourchette publiée : +/- 10 % autour de l'estimation
      depth_column: recent_sales_1km # profondeur du marché -> niveau de confiance
      unit_column: surface_m2        # prix au m2 affiché à l'utilisateur
      min_market_depth: 10           # en dessous, le bien est orienté vers une revue humaine

learning_objectives:
  - "Normaliser une cible continue en interne : pourquoi un MSE sur des montants en euros diverge et comment l'éviter."
  - "Comprendre ce que coûte le deep learning sur données tabulaires et quand lui préférer un booster."
  - "Régulariser un réseau : dropout, weight decay, batch norm, early stopping avec restauration du meilleur état."
  - "Ordonnancer le taux d'apprentissage (cosine, plateau) et lire son effet sur les courbes d'apprentissage."
  - "Garantir le déterminisme : graine avant construction du graphe, mélange semé, CPU."
  - "Déclarer un graphe (entrées -> couches -> modèle) puis le compiler avec optimiseur, perte et métriques."
  - "Sauvegarder au format natif .keras (poids + architecture) avec un sidecar JSON de métadonnées de projet."


# -------------------------------------------------------------------------------------------
# Registre des stacks technologiques.
#
# Une stack == une implémentation d'un même cas d'usage avec un framework donné.
# Le moteur de génération (`tools/scaffold`) utilise ces métadonnées pour :
#   * sélectionner le dossier de templates `templates/stack/<key>/`,
#   * générer `requirements.txt` et `pyproject.toml` (dépendances),
#   * documenter la stack dans le README (liens, notes d'installation, commandes).
# -------------------------------------------------------------------------------------------

sklearn:
  display_name: scikit-learn
  category: classic-ml
  template_dir: sklearn
  epochs_based: false
  supports_proba: true
  dependencies:
    - "numpy>=1.26"
    - "pandas>=2.2"
    - "pyarrow>=15.0"
    - "scikit-learn>=1.4"
    - "scipy>=1.11"
    - "joblib>=1.3"
  docs:
    - name: "scikit-learn User Guide"
      url: "https://scikit-learn.org/stable/user_guide.html"
    - name: "sklearn Pipeline & ColumnTransformer"
      url: "https://scikit-learn.org/stable/modules/compose.html"
  notes:
    - "Référence absolue pour le ML tabulaire : pipelines composables, transformers custom, métriques."
    - "`ColumnTransformer` évite toute fuite de données : le scaling/encodage est appris sur le train uniquement."
  commands:
    train: "python -m src.main mode=train"

xgboost:
  display_name: XGBoost
  category: boosting
  template_dir: xgboost
  epochs_based: false
  supports_proba: true
  dependencies:
    - "numpy>=1.26"
    - "pandas>=2.2"
    - "pyarrow>=15.0"
    - "scikit-learn>=1.4"
    - "xgboost>=2.0"
    - "joblib>=1.3"
  docs:
    - name: "XGBoost Documentation"
      url: "https://xgboost.readthedocs.io/"
    - name: "XGBoost Parameters"
      url: "https://xgboost.readthedocs.io/en/stable/parameter.html"
  notes:
    - "Gradient boosting regularisé (L1/L2), très performant sur données tabulaires structurées."
    - "Early stopping intégré via `eval_set` : surveille la métrique de validation à chaque boosting round."
  commands:
    train: "python -m src.main mode=train"

lightgbm:
  display_name: LightGBM
  category: boosting
  template_dir: lightgbm
  epochs_based: false
  supports_proba: true
  dependencies:
    - "numpy>=1.26"
    - "pandas>=2.2"
    - "pyarrow>=15.0"
    - "scikit-learn>=1.4"
    - "lightgbm>=4.3"
    - "joblib>=1.3"
  docs:
    - name: "LightGBM Documentation"
      url: "https://lightgbm.readthedocs.io/"
    - name: "Parameters Tuning"
      url: "https://lightgbm.readthedocs.io/en/latest/Parameters-Tuning.html"
  notes:
    - "Histogram-based + leaf-wise growth : entraînement très rapide sur gros volumes."
    - "Support natif des variables catégorielles (`categorical_feature`) sans one-hot encoding."
  commands:
    train: "python -m src.main mode=train"

pytorch:
  display_name: PyTorch
  category: deep-learning
  template_dir: pytorch
  epochs_based: true
  supports_proba: true
  dependencies:
    - "numpy>=1.26"
    - "pandas>=2.2"
    - "pyarrow>=15.0"
    - "scikit-learn>=1.4"
    - "torch>=2.2"
  docs:
    - name: "PyTorch Tutorials"
      url: "https://pytorch.org/tutorials/"
    - name: "torch.nn"
      url: "https://pytorch.org/docs/stable/nn.html"
  notes:
    - "`nn.Module` explicite, boucle d'entraînement écrite à la main : pédagogie maximale."
    - "Déterminisme : `torch.manual_seed`, `torch.use_deterministic_algorithms` et `num_workers=0` par défaut."
  commands:
    train: "python -m src.main mode=train"

tensorflow:
  display_name: TensorFlow
  category: deep-learning

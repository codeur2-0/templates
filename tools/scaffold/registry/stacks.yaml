      url: "https://huggingface.co/docs/transformers/training"
  notes:
    - "Le modèle est instancié depuis une **config** (`AutoConfig`) avec des poids aléatoires : aucun téléchargement réseau."
    - "Architecture minuscule (quelques couches) pour rester exécutable sur un laptop/CPU en quelques minutes."

    - name: "Keras Callbacks"
      url: "https://keras.io/api/callbacks/"
  notes:
    - "API fonctionnelle déclarative : le graphe du réseau est construit puis compilé (`compile/fit`)."
    - "Callbacks natifs : `EarlyStopping`, `ReduceLROnPlateau`, `ModelCheckpoint`."
  commands:
    train: "python -m src.main mode=train"


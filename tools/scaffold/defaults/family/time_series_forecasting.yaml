# ==============================================================================================
# Famille « séries temporelles / forecasting » — cas d'usage : prévision de la consommation
# électrique régionale à l'horizon J+1..J+7 pour un gestionnaire de réseau de distribution.
# Toutes les stacks de cette famille (sklearn, xgboost, lightgbm, pytorch, keras) partagent
# EXACTEMENT ce cas d'usage, ces données et ces métriques : seule l'implémentation du modèle
# change. C'est ce qui rend la comparaison pédagogique et honnête.
# ==============================================================================================

domain: data-science
problem: time-series-forecasting
modality: tabular
family: time_series_forecasting

business:
  persona: >-
    Équipe Prévisions d'un gestionnaire de réseau de distribution électrique (data scientist qui
    industrialise le modèle, analyste marché qui engage les achats d'énergie, et astreinte
    conduite qui équilibre l'offre et la demande en J+1).
  context: >-
    Le réseau doit annoncer chaque matin sa consommation prévisionnelle pour les sept prochains
    jours : c'est cette annonce qui pilote les achats sur les marchés de gros, le programme
    d'appel des groupes de production et les alertes « équilibre menace » en cas d'écart.
    Aujourd'hui la prévision est construite à la main à partir d'un profil hebdomadaire moyen et
    d'un ajustement météo au jugement de l'analyste. Résultat : un écart moyen de 4 à 6 % qui
    double pendant les vagues de froid, alors que chaque point d'erreur sur 2 500 MW représente
    environ 25 MW à compenser en urgence — au prix spot du jour, souvent le plus élevé de l'année.
  problem: >-
    Prédire la consommation électrique quotidienne régionale (en MW) pour les horizons J+1, J+2,
    J+3 et J+7, à partir de l'histoire de consommation disponible **au matin de l'origine** et
    de la prévision météo connue à ce même instant, puis publier une prévision assortie d'un
    intervalle et d'un indicateur de confiance.
  inputs: >-
    Historique de consommation quotidienne (décalages 1, 2, 7, 14 et 28 jours, moyennes et
    dispersion glissantes 7 et 28 jours), ancrage saisonnier (même jour de la semaine précédente),
    prévision de température pour le jour cible et son écart à la normale saisonnière, degrés-jours
    de chauffe et de froid, calendrier du jour cible (jour de la semaine, week-end, jour férié,
    vacances scolaires), horizon visé.
  outputs: >-
    Consommation prévisionnelle en MW par horizon, écart relatif attendu (MAPE par horizon),
    intervalle de prévision, indicateur de confiance (régime stable / épisode extrême / rupture
    d'historique) et facteurs dominants de la prévision (température, calendrier, niveau récent).
  value: >-
    Réduction des achats d'urgence et des pénalités d'écart, meilleure anticipation des pointes de
    froid et de canicule, traçabilité de la prévision (chiffre, intervalle, raisons) devant le
    régulateur, et détection automatique des jours où la prévision doit être revue par un humain.
  success_criteria:
    - "MAPE ≤ 4,0 % sur le split de test chronologique, tous horizons confondus. Mesuré : à renseigner après la première exécution de référence."
    - "Le modèle doit battre le **naif saisonnier** (même jour de la semaine précédente) d'au moins 30 % en MAPE : c'est le seul seuil qui prouve une valeur ajoutée."
    - "MAPE ≤ 6,0 % à l'horizon J+7 : la dégradation avec l'horizon doit rester maîtrisée (le J+7 pilote les achats hebdomadaires)."
    - "MASE ≤ 0,75 : l'erreur doit être inférieure à celle du naif saisonnier pris comme référence d'échelle."
    - "Biais moyen < 1,5 % et aucun mois dont le biais dépasse 4 % : une prévision systématiquement basse fait acheter trop cher en urgence."
    - "Couverture de l'intervalle de prévision ≥ 85 % pour un niveau nominal de 90 %."
    - "Reproductibilité : deux exécutions avec la même graine produisent exactement les mêmes métriques."
  cadence: >-
    Prévision publiée chaque matin à 06h00 pour les sept jours à venir ; ré-entraînement
    hebdomadaire sur l'historique glissant, et recalibrage immédiat après un épisode extrême.
  constraints:
    - "Aucune donnée réelle de consommation : le dataset de ce dépôt est synthétique et hors ligne."
    - "Interdiction absolue de fuite temporelle : une feature ne peut utiliser que l'information disponible au matin de l'origine (historique) ou connue par avance (calendrier, prévision météo)."
    - "Le split d'évaluation est chronologique : jamais de mélange aléatoire, jamais de validation croisée aléatoire sur des séries temporelles."
    - "Le modèle doit s'exécuter sur CPU en moins de 5 secondes pour les 7 horizons d'une journée (contrainte d'astreinte)."
    - "Les épisodes extrêmes (vague de froid, canicule, arrêt industriel) ne doivent pas être rognés : ce sont précisément les jours où la prévision vaut de l'argent."

data:
  dataset_name: regional_electricity_load
  title: "Consommation électrique régionale et prévision multi-horizons"
  description: >-
    Jeu d'apprentissage supervisé construit par **expansion temporelle** d'une série quotidienne de
    consommation régionale (~3,4 ans) : chaque ligne correspond à un couple (origine, horizon) et
    porte la consommation réellement observée `horizon_days` jours après l'origine, ainsi que les
    seules informations disponibles au matin de cette origine. La série sous-jacente est générée
    par un modèle explicite et réaliste : niveau de base, tendance lente, saisonnalité annuelle
    (pointe hivernale), saisonnalité hebdomadaire (creux du week-end), thermo-sensibilité
    asymétrique (3,5 % par degré sous 15 °C, trois fois moins au-dessus de 24 °C car le parc
    français est peu climatisé), jours fériés et vacances
    scolaires, épisodes extrêmes (vague de froid, canicule, arrêt industriel) et bruit autocorrélé
    AR(1). La prévision de température fournie au modèle est la vérité **entachée d'une erreur de
    prévision croissante avec l'horizon**, comme dans la réalité : c'est ce qui rend la dégradation
    du J+1 au J+7 incompressible.
  n_samples: 4800
  seed: 42
  formats: [parquet, csv]
  target: load_mw
  id_column: sample_id
  # Colonne temporelle du split : sa simple présence active le découpage chronologique
  # (`DatasetSplitter` bascule `time_based` à vrai), ce qui interdit toute fuite du futur.
  time_column: origin_date
  # Pas de colonne de groupe : le découpage est chronologique et l'horizon doit rester présent
  # dans chaque split (grouper par horizon viderait le J+7 de l'entraînement).
  group_column: null
  columns:
    - name: sample_id
      dtype: str
      role: identifier
      description: "Identifiant unique du couple (origine, horizon)"
      unique: true
      checks: { regex: "^FC-[0-9]{5}-H[0-9]{1,2}$" }
      distribution: "identifiants séquentiels déterministes"
    - name: origin_date
      dtype: datetime
      role: timestamp
      description: "Date de l'origine : dernier jour dont la consommation est connue au moment de la prévision"
      distribution: "étalement chronologique sur ~1 200 origines consécutives"
    - name: horizon_days
      dtype: int
      role: feature
      description: "Horizon visé en jours (1, 2, 3 ou 7) — le modèle apprend la dégradation avec l'horizon"
      unit: "jours"
      checks: { isin: [1, 2, 3, 7] }
      distribution: "quatre horizons équirépartis (25 % chacun)"
    - name: target_date
      dtype: datetime
      role: metadata
      description: "Date prévue (origine + horizon) — sert à l'analyse d'erreur, jamais au modèle"
    - name: target_month
      dtype: str
      role: metadata
      description: "Mois du jour cible, pour la ventilation saisonnière des erreurs"
      checks: { isin: [jan, feb, mar, apr, may, jun, jul, aug, sep, oct, nov, dec] }
    - name: event_type
      dtype: str
      role: metadata
      description: "Nature de l'épisode touchant le jour cible (aucun, vague de froid, canicule, arrêt industriel)"
      checks: { isin: [none, cold_snap, heatwave, industrial_shutdown] }
      distribution: "~96 % none, 1,7 % cold_snap, 1,5 % heatwave, 0,7 % industrial_shutdown"
    - name: is_extreme_event
      dtype: bool
      role: metadata
      description: "Vrai si le jour cible appartient à un épisode extrême — cible prioritaire de l'analyse d'erreur"
      distribution: "~4 % de vrais"
    - name: load_mw
      dtype: float
      role: target
      description: "Consommation électrique régionale observée le jour cible"
      unit: "MW"
      checks: { ge: 200.0, le: 8000.0 }
      distribution: "médiane ~2 190 MW, pointe de vague de froid ~4 900 MW, creux estival ~1 050 MW"
    - name: load_last_observed
      dtype: float
      role: feature
      description: "Dernière consommation connue : le jour de l'origine lui-même (ancre de persistance)"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_lag_1d
      dtype: float
      role: feature
      description: "Consommation un jour avant l'origine"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_lag_2d
      dtype: float
      role: feature
      description: "Consommation deux jours avant l'origine"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_lag_7d
      dtype: float
      role: feature
      description: "Consommation sept jours avant l'origine (même jour de la semaine que l'origine)"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_lag_14d
      dtype: float
      role: feature
      description: "Consommation quatorze jours avant l'origine"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_lag_28d
      dtype: float
      role: feature
      description: "Consommation vingt-huit jours avant l'origine (niveau de référence mensuel)"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_rolling_mean_7d
      dtype: float
      role: feature
      description: "Moyenne glissante 7 jours de la consommation, terminée à l'origine"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_rolling_std_7d
      dtype: float
      role: feature
      description: "Écart-type glissant 7 jours : volatilité récente du réseau"
      unit: "MW"
      checks: { ge: 0.0, le: 2000.0 }
    - name: load_rolling_min_7d
      dtype: float
      role: feature
      description: "Minimum glissant 7 jours : plancher récent (détecte un creux de vacances)"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_rolling_mean_28d
      dtype: float
      role: feature
      description: "Moyenne glissante 28 jours : niveau de fond mensuel"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: load_seasonal_naive
      dtype: float
      role: feature
      description: "Ancrage saisonnier : consommation du même jour de la semaine, une semaine avant le jour cible (toujours ≤ origine, donc licite)"
      unit: "MW"
      checks: { ge: 150.0, le: 8500.0 }
    - name: temperature_forecast_c
      dtype: float
      role: feature
      description: "Prévision de température moyenne pour le jour cible, disponible à l'origine — entachée d'une erreur croissante avec l'horizon"
      unit: "°C"
      checks: { ge: -25.0, le: 48.0 }
      distribution: "erreur de prévision N(0, 0,35 °C) à J+1 jusqu'à N(0, 1,2 °C) à J+7"
    - name: temperature_forecast_prev_c
      dtype: float
      role: feature
      description: "Prévision de température de la veille du jour cible (observation à J+1) — permet au modèle de reconstruire l'inertie thermique du bâti"
      unit: "°C"
      nullable: true
      checks: { ge: -25.0, le: 48.0 }
      distribution: "erreur de prévision d'une échéance plus courte d'un jour ; manquante quand le capteur de l'origine est en panne (à J+1 uniquement)"
    - name: temperature_anomaly_c
      dtype: float
      role: feature
      description: "Écart de la prévision de température à la normale saisonnière du jour cible"
      unit: "°C"
      checks: { ge: -25.0, le: 25.0 }
    - name: temperature_lag_1d
      dtype: float
      role: feature
      description: "Température observée à l'origine"
      unit: "°C"
      nullable: true
      checks: { ge: -25.0, le: 48.0 }
    - name: temperature_rolling_mean_7d
      dtype: float
      role: feature
      description: "Moyenne glissante 7 jours de la température observée, terminée à l'origine"
      unit: "°C"
      nullable: true
      checks: { ge: -25.0, le: 48.0 }
    - name: hdd_target
      dtype: float
      role: feature
      description: "Degrés-jours de chauffe du jour cible : max(0, 18 °C - température prévue)"
      unit: "°C"
      checks: { ge: 0.0, le: 40.0 }
    - name: cdd_target
      dtype: float
      role: feature
      description: "Degrés-jours de froid du jour cible : max(0, température prévue - 24 °C)"
      unit: "°C"
      checks: { ge: 0.0, le: 25.0 }
    - name: target_weekday
      dtype: str
      role: feature
      description: "Jour de la semaine du jour cible (connu par avance)"
      checks: { isin: [mon, tue, wed, thu, fri, sat, sun] }
      distribution: "~14,3 % par jour, léger déséquilibre dû au découpage des origines"
    - name: target_is_weekend
      dtype: bool
      role: feature
      description: "Vrai si le jour cible tombe un samedi ou un dimanche"
      distribution: "~28,6 % de vrais"
    - name: target_is_holiday
      dtype: bool
      role: feature
      description: "Vrai si le jour cible est un jour férié national français"
      distribution: "~3,2 % de vrais"
    - name: target_school_holiday
      dtype: bool
      role: feature
      description: "Vrai si le jour cible tombe pendant les vacances scolaires (effet résidentiel marqué)"
      distribution: "~33 % de vrais"
    - name: target_doy_sin
      dtype: float
      role: feature
      description: "Composante sinus du jour de l'année cible (encodage cyclique de la saisonnalité annuelle)"
      checks: { ge: -1.0, le: 1.0 }
    - name: target_doy_cos
      dtype: float
      role: feature
      description: "Composante cosinus du jour de l'année cible"
      checks: { ge: -1.0, le: 1.0 }
  insights:
    - "Le bâti réagit à une température lissée sur deux jours, pas à la seule valeur du jour cible : fournir la prévision de la veille (`temperature_forecast_prev_c`) et sa variation est ce qui permet au modèle de reconstruire cette inertie, et c'est un des rares gains disponibles au-delà du réglage des hyperparamètres."
    - "La consommation est pilotée à ~65 % par le calendrier et la température : un modèle qui ne connaît que les décalages temporels rate les épisodes de froid, un modèle qui ne connaît que la météo rate le creux du week-end. Les deux familles de features sont complémentaires, et le notebook 04 mesure leur apport séparé."
    - "L'erreur croît avec l'horizon (MAPE J+1 ≈ moitié du MAPE J+7) pour deux raisons distinctes : l'erreur de prévision météo augmente, et l'information de court terme (J-1) devient moins pertinente. Publier un MAPE unique sans ventilation par horizon masque cette structure."
    - "Le bruit est autocorrélé (AR(1) de coefficient ~0,6) : les résidus ne sont pas indépendants, donc les intervalles de confiance gaussiens naïfs sont trop étroits et le backtest par origine glissante est obligatoire — la validation croisée aléatoire produirait un score optimiste et faux."
    - "`temperature_lag_1d` et `temperature_rolling_mean_7d` comportent des manquants volontaires (~3 %, panne de capteur, surreprésentés en hiver) : l'imputation doit être explicite et un indicateur de manquant est rentable."
    - "Les jours fériés et les ponts produisent des creux de 10 à 20 % que le seul jour de la semaine ne prédit pas : sans feature calendaire explicite, le modèle sur-prévoit systématiquement ces jours-là."
    - "Le générateur injecte trois régimes de rupture (vague de froid, canicule, arrêt industriel) qui représentent ~4 % des jours cibles mais une part disproportionnée de l'erreur totale : c'est le cœur de l'analyse d'erreur du notebook 06. Les deux premiers déplacent réellement la température — un front lissé sur trois jours — donc le modèle peut les anticiper ; l'arrêt industriel est un choc de demande sans aucune signature météo, volontairement imprévisible."
  recommendations:
    - "Toujours comparer le modèle à trois références triviales (persistance, naif saisonnier, climatologie) : battre un apprentissage de référence n'a aucune valeur opérationnelle."
    - "Valider par **origine glissante** (rolling-origin backtest) et jamais par validation croisée aléatoire : le découpage chronologique du split principal ne suffit pas à détecter une fuite de features."
    - "Publier une prévision par horizon et un intervalle, jamais un chiffre unique : l'acheteur d'énergie raisonne en risque, pas en point."
    - "Piloter sur le MAPE et le MASE plutôt que sur la RMSE seule : la RMSE est dominée par les pointes hivernales et fait croire à une dégradation quand seule l'amplitude saisonnière augmente."
    - "Surveiller la thermo-sensibilité apprise (MW par degré) : elle dérive avec la rénovation du parc et l'électrification des usages, et c'est le premier signe d'un modèle périmé."
    - "Ne jamais rogner les extrêmes au pré-traitement : la vague de froid est exactement le jour où l'erreur coûte le plus cher. Préférer une feature de régime et un indicateur de confiance."
    - "Documenter le contrat d'antériorité de chaque feature (connue à l'origine / connue par avance / interdite) : c'est la revue qui évite 90 % des fuites en séries temporelles."
  notes:
    - "Construction par expansion temporelle : 1 200 origines x 4 horizons = 4 800 lignes. Les quatre lignes d'une même origine partagent leur histoire et diffèrent par le jour cible."
    - "Contract d'antériorité : `load_lag_*`, `load_rolling_*` et `temperature_lag/rolling` sont calculés **jusqu'à l'origine incluse** ; `target_*` (calendrier) et `temperature_forecast_c` sont connus par avance ; `load_mw`, `target_date`, `event_type` et `is_extreme_event` sont des métadonnées de vérité terrain."
    - "`load_seasonal_naive` est licite bien qu'il regarde vers le jour cible : il s'agit de la consommation du jour cible **moins sept jours**, toujours antérieure ou égale à l'origine pour un horizon ≤ 7."
    - "Valeurs manquantes volontaires sur `temperature_lag_1d` (~3 %) et `temperature_rolling_mean_7d` (~3 %), avec un biais hivernal (pannes de capteur par temps de gel)."
    - "Bruit irréductible AR(1) (σ ≈ 2,2 %) plus erreur de prévision météo : un MAPE proche de 0 signerait une fuite, pas un bon modèle. Le plancher atteignable est d'environ 1,5 %."
    - "Épisodes extrêmes sur les 3,3 ans simulés : ~18 jours de vague de froid (température déplacée de -7,5 °C, consommation +30 %), ~18 jours de canicule (+6 °C, consommation +12 %) et ~9 jours d'arrêt industriel (-24 %, aucune signature météo)."

metrics:
  task: forecasting
  primary: mape
  secondary: [smape, mase, mae, rmse, r2]
  # Référence triviale du registre (médiane de la cible). Les vraies références métier — persistance,
  # naif saisonnier, climatologie — sont calculées par l'évaluateur de prévision, qui est le seul à
  # disposer de l'origine et de l'horizon de chaque ligne.
  baseline: dummy
  direction: minimize
  # Seuil de qualité : le MAPE de validation doit rester **sous** cette valeur (direction=minimize).
  # Calibré sur les mesures réelles du générateur (voir `extras.quality`).
  min_primary: 4.0

preprocessing:
  numeric:
    imputer: median
    # Aucun rognage : les pointes de froid et de canicule sont les jours où la prévision a de la
    # valeur. Rogner apprendrait au modèle à sous-prévoir exactement quand l'écart coûte cher.
    clip_outliers: false
    clip_quantiles: [0.001, 0.999]
    scaler: standard
    log1p_columns: []
  categorical:
    imputer: most_frequent
    encoder: onehot
    handle_unknown: ignore
    min_frequency: 0.01
    max_categories: 12
  features:
    # Momentum de court terme : > 1 signifie une consommation en accélération par rapport au mois.
    - type: ratio
      name: load_momentum_7_28
      numerator: load_rolling_mean_7d
      denominator: load_rolling_mean_28d
      epsilon: 1.0
    # Écart du dernier point connu à l'ancrage saisonnier : détecte une rupture en cours
    # (la recette `difference` attend `left` et `right`, contrairement à `ratio`).
    - type: difference
      name: load_gap_to_seasonal
      left: load_last_observed
      right: load_seasonal_naive
    # Régimes météo extrêmes du jour cible (features de régime plutôt que rognage des valeurs).
    - type: boolean_flag
      name: is_cold_snap_forecast
      column: temperature_forecast_c
      operator: lt
      value: 2.0
    - type: boolean_flag
      name: is_heatwave_forecast
      column: temperature_forecast_c
      operator: gt
      value: 27.0
    # Tendance thermique à l'échéance cible : un front qui monte ou qui descend ne produit pas la
    # même consommation qu'un palier, parce que le bâti réagit à une température lissée sur deux
    # jours et non à la seule valeur du jour.
    - type: difference
      name: temperature_forecast_change
      left: temperature_forecast_c
      right: temperature_forecast_prev_c
    # Horizon long : permet au modèle d'apprendre un comportement propre au J+7.
    - type: boolean_flag
      name: is_long_horizon
      column: horizon_days
      operator: gt
      value: 3.0
    # Niveau de fond discrétisé : aide les modèles linéaires à capter la non-linéarité de niveau.
    - type: bin
      name: load_level_bucket
      column: load_rolling_mean_28d
      method: quantile
      bins: 4
    # Profil de consommation par jour de la semaine cible, appris sur l'entraînement uniquement.
    - type: group_stat
      name: median_load_by_target_weekday
      group_by: target_weekday
      value_column: load_rolling_mean_7d
      agg: median
    # Saison de l'origine (année/trimestre) : capte la tendance lente et les ruptures de période.
    - type: datetime_parts
      name: origin_period
      column: origin_date
      prefix: origin
      parts: [year, quarter]

train:
  split:
    test_size: 0.2
    val_size: 0.15
    # Cible continue : pas de stratification. Le découpage est chronologique (imposé par
    # `data.time_column`), donc le mélange est désactivé.
    stratify: false
    shuffle: false
    time_based: true
  # Pas de validation croisée aléatoire : sur des séries temporelles elle mélange les époques et
  # produit un score optimiste. La validation temporelle est portée par le backtest à origine
  # glissante de l'évaluateur (`src/evaluation/evaluator.py`), qui respecte l'antériorité.
  cross_validation:
    enabled: false
    folds: 3
    strategy: kfold

learning_objectives:
  - "Construire un jeu supervisé par expansion temporelle (origine x horizon) et formaliser le contrat d'antériorité de chaque feature : connue à l'origine, connue par avance, ou interdite."
  - "Comprendre pourquoi un découpage chronologique s'impose et ce que coûte une validation croisée aléatoire sur des séries temporelles."
  - "Comparer un modèle appris à trois références triviales (persistance, naif saisonnier, climatologie) et quantifier la valeur ajoutée réelle."
  - "Choisir les bonnes métriques de prévision : MAPE et ses pièges, sMAPE, MASE, et toujours ventiler par horizon."

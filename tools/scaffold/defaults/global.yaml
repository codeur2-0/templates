# ==============================================================================================
# Valeurs par défaut partagées par TOUS les projets générés.
# Chaque manifeste (`tools/scaffold/manifests/*.yaml`) hérite de ce fichier, puis de
# `defaults/family/<family>.yaml`, puis applique ses propres valeurs.
# ==============================================================================================

modality: tabular

train:
  split:
    test_size: 0.2
    val_size: 0.15
    stratify: true
    shuffle: true
    time_based: false
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  early_stopping:
    enabled: false
    monitor: val_loss
    patience: 5
    min_delta: 0.0
    mode: min
  callbacks:
    logging_every: 1
    progress_bar: true
    metric_history: true
  artifacts:
    model_file: model.joblib
    pipeline_file: preprocessing.joblib
    feature_builder_file: feature_builder.joblib
    metrics_file: training_metrics.json
    model_card_file: model_card.json
    report_file: evaluation_report.md
    predictions_file: predictions.csv
  cross_validation:
    enabled: true
    folds: 5
    strategy: kfold
    n_jobs: -1
  n_jobs: -1

preprocessing:
  numeric:
    imputer: median
    imputer_fill_value: 0.0
    clip_outliers: true
    clip_quantiles: [0.01, 0.99]
    scaler: standard
    log1p_columns: []
  categorical:
    imputer: most_frequent
    imputer_fill_value: unknown
    encoder: onehot
    handle_unknown: ignore
    min_frequency: 0.01
    max_categories: 25
  features: []
  columns: {}
  validation:
    raw: true
    processed: true
    inference: true
    strict: true
    lazy: false

hydra: {}
extras: {}

# =================================================================================================
# Routage de tickets de support par un pipeline spaCy entraîné sur le corpus
# -------------------------------------------------------------------------------------------------
# Le même corpus que les variantes `with-tfidf_classifier` et `with-transformers` — 1 200 tickets, six catégories, trois styles rédactionnels, une classe « autre » sans vocabulaire propre — confié à un pipeline spaCy **vierge** (`spacy.blank("fr")`, tokeniseur à règles, aucun modèle téléchargé) et à son composant `textcat`. Trois architectures natives ont été comparées sur le split de validation, au protocole du projet et sur cinq graines : le sac de n-grammes haché plafonne à 0,841 de F1 macro dès la septième époque, avec la même valeur sur les cinq graines ; l'encodeur de jetons réduit atteint au mieux 0,8177 (écart-type 0,011) et l'ensemble par défaut de spaCy 0,7882 (écart-type 0,069). L'avance du sac de n-grammes dépasse deux fois la dispersion de l'encodeur : c'est un résultat, et c'est lui qui est servi. Sur le split de test, il obtient 0,8246 de F1 macro, derrière la variante lexicale (0,8408). Son trait distinctif est l'écart entre styles : 0,841 sur les tickets canoniques, 0,823 sur les paraphrases (le TF-IDF passe de 0,926 à 0,735), mais 0,721 sur les tickets bruités, son point faible.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ai-eng-text-classification-spacy
  name: tickets-routage-spacy
  domain: ai-eng
  problem: text-classification
  stack: spacy_textcat
  family: text_classification
  modality: text
  title: "Routage de tickets de support par un pipeline spaCy entraîné sur le corpus"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: multiclass
  primary: macro_f1
  secondary:
    - accuracy
    - weighted_f1
    - balanced_accuracy
    - macro_precision
    - macro_recall
    - cohen_kappa
    - mean_confidence
    - expected_calibration_error
    - latency_p50_ms
    - latency_p95_ms
    - coverage
  baseline: majorite
  direction: maximize
  min_primary: 0.7

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `text_classification` ----------------------------------
train:
  artifacts:
    model_file: classifier.joblib

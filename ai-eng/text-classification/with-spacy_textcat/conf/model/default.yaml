# =================================================================================================
# Modèle : spaCy TextCatBOW (sac de n-grammes haché, couche linéaire) sur un pipeline vierge
# -------------------------------------------------------------------------------------------------
# Le sac de n-grammes de spaCy hache les unigrammes et les bigrammes du ticket dans une table fixe
# et apprend une couche linéaire par classe : pas de vocabulaire à construire, pas de mot hors
# vocabulaire, et un ajustement d'une dizaine de secondes sur 719 tickets. Il a été choisi au
# terme d'une étude rejouable (`scripts/architecture_study.py`) faite au protocole du projet —
# lots de 64, défauts du registre pour chaque architecture, split de validation, cinq graines : il
# plafonne à 0,841 de F1 macro dès la septième époque, avec la même valeur sur les cinq graines,
# quand l'encodeur de jetons réduit atteint au mieux 0,8177 (écart-type 0,011). L'avance (0,023)
# dépasse deux fois la dispersion de l'encodeur : c'est un écart réel, pas un tirage. Le budget de
# huit époques se place sur ce plateau. La limite est mesurée : le modèle est **sous-confiant** —
# confiance moyenne 0,561 pour une exactitude de 0,819 en test, d'où un écart de calibration de
# 0,258 — et il ne faut donc pas router automatiquement sur sa confiance brute sans la recalibrer
# sur le split `calibration` que la famille réserve à cet usage. Chaque décision s'explique par
# occlusion : le jeton est retiré du ticket, et la baisse de probabilité est publiée.
#
# Alternatives considérées : `textcat_reduce` (encodeur de jetons : plongements hachés sur la forme normalisée, la forme en minuscules, le préfixe et le suffixe, convolution, moyenne et maximum) : 0,8177 ± 0,011 de F1 macro en validation au mieux (époque 9), soit 0,023 de moins que le sac de n-grammes ; c'est le choix à rejouer quand le corpus grossit, parce qu'il est le seul de la stack à lire les sous-mots., `textcat_ensemble` (architecture par défaut de spaCy, sac de n-grammes + encodeur) : 0,7882 ± 0,069 au mieux, et une dispersion entre graines dix fois plus forte que l'encodeur seul — sur 719 tickets, l'ensemble ne retrouve pas la qualité de sa meilleure composante. Résultat négatif publié, que le notebook 04 reproduit., Lots de 16 au lieu de 64 : 0,8342 ± 0,016 pour le sac de n-grammes — plus de pas d'optimisation, mais un résultat moins bon et dépendant de la graine., Variante `with-tfidf_classifier` : même corpus, mêmes splits ; meilleure moyenne de la famille (0,8408 en test), explicable terme à terme, mais très dépendante du vocabulaire (0,926 sur le canonique, 0,735 sur les paraphrases)., Variante `with-transformers` : encodeur appris sur le corpus, l'approche la plus forte sur les paraphrases d'après ses mesures publiées, au prix de minutes d'entraînement et d'une forte sur-confiance., Pipeline spaCy pré-entraîné (`fr_core_news_md`, vecteurs de mots) : hors périmètre, parce que le projet interdit tout téléchargement de modèle à l'exécution..
#
# Surcharge en ligne de commande :
#   python -m src.main mode=train model.params.language=...
# =================================================================================================

name: "spaCy TextCatBOW (sac de n-grammes haché, couche linéaire) sur un pipeline vierge"
algorithm: textcat_bow
class: SpacyTextClassifier
task: multiclass
supports_proba: true
epochs_based: true
random_state: ${seed}

# Hyperparamètres du modèle : ils sont transmis tels quels au constructeur
# `SpacyTextClassifier(params=...)` (voir src/models/model.py).
params:
  language: fr

# --- options spécifiques à la stack `spacy_textcat` ---------------------------------------
text_column: text

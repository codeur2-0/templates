[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ===============================================================================================
# Routage de tickets de support par un encodeur appris sur le corpus
# Le même corpus que la variante `with-tfidf_classifier` — 1 200 tickets, six catégories, trois styles rédactionnels, une classe « autre » sans vocabulaire propre — confié cette fois à des modèles neuronaux entraînés **sur le corpus** : vocabulaire appris sur le train, sac d'embeddings ou encodeur de type BERT, pré-entraînement masqué sans aucun libellé puis affinage supervisé. La comparaison des trois architectures sur le split de validation donne le résultat publié du projet : sur 719 tickets d'entraînement, l'encodeur à deux couches atteint 0,8022 de F1 macro, la moyenne des vecteurs de termes 0,7455, et l'encodeur à quatre couches reste bloqué à 0,0559. Le partage avec la variante lexicale est net : l'encodeur gagne 0,09 sur les paraphrases (0,8285 contre 0,7352) mais perd 0,14 sur les tickets canoniques (0,7892 contre 0,9262). Le facteur décisif n'est donc pas la profondeur mais le **régime d'entraînement** : un encodeur initialisé au hasard diverge au taux d'apprentissage qui fait converger un sac d'embeddings, et les réglages gagnants de la grille de sélection sont devenus les défauts de la stack — c'est ce qui permet au notebook 04 de comparer les trois architectures sans réglage avantageux pour l'une d'elles.
# ===============================================================================================
[project]
name = "tickets_routage_transformers"
version = "1.0.0"
description = "Le même corpus que la variante `with-tfidf_classifier` — 1 200 tickets, six catégories, trois styles rédactionnels, une classe « autre » sans vocabulaire propre — confié cette fois à des modèles neuronaux entraînés **sur le corpus** : vocabulaire appris sur le train, sac d'embeddings ou encodeur de type BERT, pré-entraînement masqué sans aucun libellé puis affinage supervisé. La comparaison des trois architectures sur le split de validation donne le résultat publié du projet : sur 719 tickets d'entraînement, l'encodeur à deux couches atteint 0,8022 de F1 macro, la moyenne des vecteurs de termes 0,7455, et l'encodeur à quatre couches reste bloqué à 0,0559. Le partage avec la variante lexicale est net : l'encodeur gagne 0,09 sur les paraphrases (0,8285 contre 0,7352) mais perd 0,14 sur les tickets canoniques (0,7892 contre 0,9262). Le facteur décisif n'est donc pas la profondeur mais le **régime d'entraînement** : un encodeur initialisé au hasard diverge au taux d'apprentissage qui fait converger un sac d'embeddings, et les réglages gagnants de la grille de sélection sont devenus les défauts de la stack — c'est ce qui permet au notebook 04 de comparer les trois architectures sans réglage avantageux pour l'une d'elles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Data & AI Platform Team" }]
keywords = [
    "ai-eng",
    "text-classification",
    "transformers",
    "hydra",
    "pandera",
    "oop",
    "mlops",
]
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pandera[pandas]>=0.20",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "torch>=2.2",
    "transformers>=4.40",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "numpy<2.4",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "torch>=2.2",
    "transformers>=4.40",
    "tokenizers>=0.19",
]

[project.scripts]
tickets_routage_transformers = "src.main:main"

# Le package applicatif s'appelle `src` (arborescence imposée par le standard du dépôt).
[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = false

# ---------------------------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["outputs", "multirun", "artifacts", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "RUF"]
# D203/D213 : conventions pydocstyle incompatibles entre elles (une seule des deux est possible).
# B008      : appel de fonction dans un argument par défaut — pattern standard FastAPI/Typer.
# N803/N806 : la convention scikit-learn impose `X` et `y` (majuscule pour la matrice) ; renommer
#             ces variables dégraderait la lisibilité pour toute personne venant de sklearn.
# RUF022    : `src/models/__init__.py` est généré par le scaffold. Son `__all__` est ordonné par
#             catégorie (constantes, classes, fonctions) ; le tri « naturel » de ruff placerait la
#             classe du modèle avant ou après `ModelCard` selon la stack, ce qui rendrait le
#             template non déterministe. L'ordre sémantique est préféré, et documenté ici.
ignore = ["D203", "D213", "B008", "N803", "N806", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------------------------
# mypy — typage
# ---------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["outputs/", "multirun/", "artifacts/", "\\.venv/"]

# pandas >= 3 publie ses propres annotations : la valeur rendue par `itertuples()` y est typée
# comme l'union de tous les scalaires possibles, donc `int(row.start)` — du code correct — devient
# une erreur de typage. Le contrat de qualité de ce projet porte sur **son** code, pas sur les
# annotations d'une dépendance : les modules de pandas ne sont pas suivis (`ignore_missing_imports`
# ci-dessus), donc leurs types ne décident pas de ce qui est légal ici.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
follow_imports = "skip"

# ---------------------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests lents (entraînement complet)",
    "integration: tests de bout en bout (pipeline complet)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ---------------------------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false

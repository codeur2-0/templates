# =================================================================================================
# Routage de tickets de support par un encodeur appris sur le corpus
# -------------------------------------------------------------------------------------------------
# Le même corpus que la variante `with-tfidf_classifier` — 1 200 tickets, six catégories, trois styles rédactionnels, une classe « autre » sans vocabulaire propre — confié cette fois à des modèles neuronaux entraînés **sur le corpus** : vocabulaire appris sur le train, sac d'embeddings ou encodeur de type BERT, pré-entraînement masqué sans aucun libellé puis affinage supervisé. La comparaison des trois architectures sur le split de validation donne le résultat publié du projet : sur 719 tickets d'entraînement, l'encodeur à deux couches atteint 0,8022 de F1 macro, la moyenne des vecteurs de termes 0,7455, et l'encodeur à quatre couches reste bloqué à 0,0559. Le partage avec la variante lexicale est net : l'encodeur gagne 0,09 sur les paraphrases (0,8285 contre 0,7352) mais perd 0,14 sur les tickets canoniques (0,7892 contre 0,9262). Le facteur décisif n'est donc pas la profondeur mais le **régime d'entraînement** : un encodeur initialisé au hasard diverge au taux d'apprentissage qui fait converger un sac d'embeddings, et les réglages gagnants de la grille de sélection sont devenus les défauts de la stack — c'est ce qui permet au notebook 04 de comparer les trois architectures sans réglage avantageux pour l'une d'elles.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ai-eng-text-classification-transformers
  name: tickets-routage-transformers
  domain: ai-eng
  problem: text-classification
  stack: transformers
  family: text_classification
  modality: text
  title: "Routage de tickets de support par un encodeur appris sur le corpus"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: multiclass
  primary: macro_f1
  secondary:
    - accuracy
    - weighted_f1
    - balanced_accuracy
    - macro_precision
    - macro_recall
    - cohen_kappa
    - mean_confidence
    - expected_calibration_error
    - latency_p50_ms
    - latency_p95_ms
    - coverage
  baseline: majorite
  direction: maximize
  min_primary: 0.7

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# =================================================================================================
# Modèle : Régression logistique multinomiale sur TF-IDF de mots
# -------------------------------------------------------------------------------------------------
# Les tickets d'une même catégorie partagent un vocabulaire (« facture », « prélèvement » pour la
# facturation ; « colis », « livraison » pour la livraison) et unigrammes comme bigrammes
# suffisent à les séparer. La régression logistique apprend un coefficient par terme et par classe
# (`class_weight='balanced'`, sinon la classe « autre » — 12 % du corpus — serait sacrifiée au
# profit des cinq autres), et le modèle expose ses poids : chaque décision peut être expliquée par
# les trois termes qui l'ont emporté. Sa limite est mesurée, pas supposée : un ticket qui parle de
# « colis jamais reçu » et un qui parle de « livraison en retard » n'ont aucun terme en commun, et
# le segment paraphrase existe pour chiffrer ce que cela coûte. La variante `with-transformers` a
# été construite pour répondre à cette limite, et la réponse est publiée : sur ce corpus, un
# encodeur appris sur le train réduit l'écart de 0,09 sur les paraphrases (0,8285 contre 0,7352 de
# F1 macro) mais perd 0,14 sur les tickets canoniques (0,7892 contre 0,9262) — au total, le
# lexical reste devant (0,8408 contre 0,7942 en test), et c'est l'arbitrage que les deux variantes
# documentent.
#
# Alternatives considérées : `tfidf_nb` (bayésien naïf complémentaire, α = 0,3) : plus rapide et robuste au déséquilibre, mais il suppose les termes indépendants ; il sert de témoin dans le notebook 04., `tfidf_centroid` : le centroïde de chaque classe, sans apprentissage de poids — le plancher de la famille., Variante `with-transformers` : même corpus, mêmes splits, même évaluation ; elle mesure ce qu'un modèle neuronal appris **sur le corpus** apporte — un encodeur à deux couches gagne 0,09 de F1 macro sur les paraphrases (0,8285 contre 0,7352) et perd 0,14 sur les tickets canoniques, pour un total de 0,7942 en test contre 0,8408 : le compromis est publié, pas caché., Fusion des deux variantes (`text_classification` + `transformers` + TF-IDF) : la pratique industrielle quand le lexical garde l'avantage sur les tickets bruités (caractères, références de commande)..
#
# Surcharge en ligne de commande :
#   python -m src.main mode=train model.params.lexical=...
# =================================================================================================

name: "Régression logistique multinomiale sur TF-IDF de mots"
algorithm: tfidf_logreg
class: TfidfClassifier
task: multiclass
supports_proba: true
epochs_based: false
random_state: ${seed}

# Hyperparamètres du modèle : ils sont transmis tels quels au constructeur
# `TfidfClassifier(params=...)` (voir src/models/model.py).
params:
  lexical:
    mode: tfidf
    ngram_range:
    - 1
    - 2
    min_df: 2
    sublinear_tf: true
  estimator:
    C: 4.0
    max_iter: 400
    class_weight: balanced

# --- options spécifiques à la stack `tfidf_classifier` ---------------------------------------
text_column: text

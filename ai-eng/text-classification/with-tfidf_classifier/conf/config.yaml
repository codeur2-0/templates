# =================================================================================================
# Routage de tickets de support par TF-IDF — la référence explicable
# -------------------------------------------------------------------------------------------------
# Six catégories de support, 1 200 tickets synthétiques écrits trois fois — vocabulaire de la catégorie, paraphrase, bruit partagé — et une classe « autre » volontairement sans vocabulaire propre. Le classifieur est une régression logistique multinomiale sur TF-IDF : un poids par terme et par classe, donc une décision qui se relit terme à terme et une explication affichable au conseiller. Ce projet est la **référence** de la famille : il chiffre ce qu'un modèle qui lit les mots obtient quand un tiers des tickets ne les emploie pas, publie l'écart entre le segment canonique et le segment paraphrase, et laisse le notebook 04 comparer les trois algorithmes de la stack sur le split de validation.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ai-eng-text-classification-tfidf
  name: tickets-routage-tfidf
  domain: ai-eng
  problem: text-classification
  stack: tfidf_classifier
  family: text_classification
  modality: text
  title: "Routage de tickets de support par TF-IDF — la référence explicable"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: multiclass
  primary: macro_f1
  secondary:
    - accuracy
    - weighted_f1
    - balanced_accuracy
    - macro_precision
    - macro_recall
    - cohen_kappa
    - mean_confidence
    - expected_calibration_error
    - latency_p50_ms
    - latency_p95_ms
    - coverage
  baseline: majorite
  direction: maximize
  min_primary: 0.7

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `text_classification` ----------------------------------
train:
  artifacts:
    model_file: classifier.joblib

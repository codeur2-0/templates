# =================================================================================================
# Extraction d'entités nommées par spaCy — le tagger appris, corroboré par des règles
# -------------------------------------------------------------------------------------------------
# Cinq types d'entités (produit, référence de commande, montant, date, transporteur), 1 200 messages de service client synthétiques annotés au caractère, écrits dans deux styles rédactionnels — 55 % rédigés (« CMD-1234 », « 12 mars 2025 ») et 45 % abrégés (« cmd 1234 », « 12/03/2025 »). Le pipeline spaCy est entraîné **sur le corpus** (`spacy.blank`, aucun modèle pré-entraîné téléchargé) et servi en **hybride** : un tagger à transitions décide, une couche de règles déclarées (motifs de référence, de montant et de date + index de surfaces appris sur le train) corrobore et comble les trous. Cette couche de règles est la référence explicable du projet : elle est chiffrée sur le même split de test, et l'écart avec le tagger est publié plutôt que supposé. Les surfaces de produits et de transporteurs des splits d'évaluation sont **réservées** — jamais vues à l'entraînement — donc le projet mesure ce qu'un modèle apprend de la *forme* d'un nom au lieu de récompenser une liste. Chaque mention publiée porte sa provenance et une confiance dont la précision est mesurée par niveau.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ai-eng-named-entity-recognition-spacy
  name: messages-extraction-entites-spacy
  domain: ai-eng
  problem: named-entity-recognition
  stack: spacy
  family: named_entity_recognition
  modality: text
  title: "Extraction d'entités nommées par spaCy — le tagger appris, corroboré par des règles"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: multiclass
  primary: entity_f1
  secondary:
    - entity_precision
    - entity_recall
    - macro_f1
    - partial_f1
    - type_accuracy
    - boundary_accuracy
    - mean_confidence
    - confidence_gap
    - predicted_entities
    - latency_p50_ms
    - latency_p95_ms
  baseline: regles
  direction: maximize
  min_primary: 0.7

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `named_entity_recognition` ----------------------------------
train:
  artifacts:
    model_file: tagger

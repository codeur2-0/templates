# =================================================================================================
# Assistant documentaire RAG orchestré avec LangChain (LCEL) — chaîne prompt + retriever + citations
# -------------------------------------------------------------------------------------------------
# Le même assistant documentaire que la baseline lexicale, mais assemblé avec LangChain : un retriever (`BaseRetriever`) sur les passages du corpus, un prompt de synthèse lu dans la configuration (`PromptTemplate`), un adaptateur LLM interchangeable (sélection extractive hors ligne par défaut, client OpenAI-compatible optionnel) et un graphe LCEL qui rattache la réponse aux passages cités. Le corpus synthétique de 128 documents est découpé en passages, indexé par BM25, par embeddings hachés (SVD tronquée apprise sur le train) ou par fusion des deux classements (RRF) : notebook 04 chiffre ce que chaque stratégie apporte sur le split de validation, et l'évaluation mesure le rappel, la précision des citations et l'abstention sur les questions hors corpus. Aucun appel réseau, aucune clé API : tout est hors ligne et à graine fixée. La comparaison avec `ai-eng/rag/with-tfidf` isole ce qu'apporte l'orchestration, à retrieval égal.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ai-eng-rag-langchain
  name: internal-knowledge-assistant-langchain
  domain: ai-eng
  problem: rag
  stack: langchain
  family: retrieval_augmented_generation
  modality: text
  title: "Assistant documentaire RAG orchestré avec LangChain (LCEL) — chaîne prompt + retriever + citations"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: retrieval
  primary: recall_at_5
  secondary:
    - mrr
    - ndcg_at_10
    - citation_precision
    - citation_recall
    - answer_f1
    - abstention_accuracy
    - abstention_recall
    - answer_coverage
  baseline: random
  direction: maximize
  min_primary: 0.6

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `retrieval_augmented_generation` ----------------------------------
retrieval:
  answer_k: 5
  abstention_threshold: 0.0
  rerank: false

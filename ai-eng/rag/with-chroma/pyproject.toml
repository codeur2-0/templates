[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "docs-rag-chroma"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["chromadb>=0.5,<1", "hydra-core>=1.3,<2", "numpy>=1.26", "pandas>=2.0,<3", "pandera[pandas]>=0.20,<1"]
[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"

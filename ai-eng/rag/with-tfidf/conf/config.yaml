# =================================================================================================
# Assistant documentaire RAG avec scikit-learn (BM25) — baseline lexicale de référence
# -------------------------------------------------------------------------------------------------
# Recherche documentaire sourcée de bout en bout (corpus synthétique de 360 documents d'entreprise -> contrats Pandera -> découpage en passages avec chevauchement -> index BM25 appris sur le train -> classement par question -> réponse extractive citant ses sources ou abstention explicite) pour une équipe support, entièrement piloté par Hydra et structuré en objets testables. L'évaluation est menée **par question** : recall@k, MRR, nDCG@k et précision des citations, confrontés au tirage aléatoire et à l'ordre du corpus, puis ventilés par difficulté (facile, paraphrase, multi-document) et par comportement d'abstention sur les questions hors corpus.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ai-eng-rag-tfidf
  name: internal-knowledge-assistant-tfidf
  domain: ai-eng
  problem: rag
  stack: tfidf
  family: retrieval_augmented_generation
  modality: text
  title: "Assistant documentaire RAG avec scikit-learn (BM25) — baseline lexicale de référence"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: retrieval
  primary: recall_at_5
  secondary:
    - mrr
    - ndcg_at_10
    - citation_precision
    - citation_recall
    - answer_f1
    - abstention_accuracy
    - abstention_recall
    - answer_coverage
  baseline: random
  direction: maximize
  min_primary: 0.6

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `retrieval_augmented_generation` ----------------------------------
retrieval:
  answer_k: 5
  abstention_threshold: 0.0
  rerank: false

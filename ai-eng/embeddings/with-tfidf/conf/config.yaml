# =================================================================================================
# Espace vectoriel creux d'un catalogue dupliqué (TF-IDF cosinus) — la référence à battre
# -------------------------------------------------------------------------------------------------
# Le même catalogue produit publié trois fois, indexé dans un espace vectoriel creux appris sur le train : vocabulaire et IDF persistés avec l'index, vecteurs normalisés, classement par similarité cosinus, puis réponse copiée du meilleur passage ou abstention explicite. Ce projet est la **référence** de la famille : il chiffre ce qu'un index de mots obtient quand la phrase à retrouver est recopiée mot pour mot dans trois fiches. Le comparer à la variante dense chiffre ce que la compression apporte : sur ce corpus l'index dense classe mieux (MRR 0,96 contre 0,91), retrouve plus souvent la phrase exacte (0,79 contre 0,76) et refuse une question hors corpus de plus, tandis que l'index creux garde la précision des citations (0,97 contre 0,94) et ne coûte que 0,07 s de construction. Les trois scorers de la stack (TF-IDF cosinus, BM25, fusion RRF du lexical et du dense) sont comparés sur le split de validation par le notebook 04.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ai-eng-embeddings-tfidf
  name: catalogue-lexical-baseline
  domain: ai-eng
  problem: embeddings
  stack: tfidf
  family: embedding_pipeline
  modality: text
  title: "Espace vectoriel creux d'un catalogue dupliqué (TF-IDF cosinus) — la référence à battre"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: retrieval
  primary: recall_at_5
  secondary:
    - recall_at_1
    - recall_at_3
    - recall_at_10
    - precision_at_1
    - mrr
    - ndcg_at_10
    - answer_f1
    - answer_exact_match
    - citation_precision
    - abstention_balanced_accuracy
    - answer_coverage
    - false_answer_rate
  baseline: random
  direction: maximize
  min_primary: 0.9

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `embedding_pipeline` ----------------------------------
retrieval:
  answer_k: 5
  abstention_threshold: 0.0
  rerank: false

# =================================================================================================
# Index vectoriel dense d'un catalogue dupliqué (hachage + SVD) — recherche et dédoublonnage
# -------------------------------------------------------------------------------------------------
# Construction et exploitation d'un index d'embeddings sur un catalogue produit publié trois fois (notice constructeur, fiche commerciale, note SAV) : hachage de n-grammes (uni+bigrammes) puis SVD tronquée apprise sur le train, normalisation L2, matrice de vecteurs persistée avec ses métadonnées et sa configuration. Le projet publie ce qu'un index a de particulier — dimension réellement produite, fidélité de la projection, taille de l'artefact, débit de requêtes, taux de succès du cache — et sert deux cas d'usage avec le même artefact : la recherche par question (rappel mesuré par segment, abstention sur les questions hors corpus) et la détection de quasi-doublons (`nearest_neighbours`), qui retrouve les deux autres fiches d'un même fait pour les 168 fiches du corpus. Aucun poids pré-entraîné, aucun téléchargement, aucun appel réseau : l'index est appris sur le corpus, à graine fixée.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: ai-eng-embeddings-embedding
  name: catalogue-embedding-index
  domain: ai-eng
  problem: embeddings
  stack: embedding
  family: embedding_pipeline
  modality: text
  title: "Index vectoriel dense d'un catalogue dupliqué (hachage + SVD) — recherche et dédoublonnage"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: retrieval
  primary: recall_at_5
  secondary:
    - recall_at_1
    - recall_at_3
    - recall_at_10
    - precision_at_1
    - mrr
    - ndcg_at_10
    - answer_f1
    - answer_exact_match
    - citation_precision
    - abstention_balanced_accuracy
    - answer_coverage
    - false_answer_rate
  baseline: random
  direction: maximize
  min_primary: 0.9

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `embedding_pipeline` ----------------------------------
retrieval:
  answer_k: 5
  abstention_threshold: 0.0
  rerank: false

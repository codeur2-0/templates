# =================================================================================================
# Résumé de comptes-rendus d'intervention — encodeur-décodeur appris, baseline extractive publiée
# -------------------------------------------------------------------------------------------------
# Résumer un compte-rendu d'intervention en quelques phrases **fidèles** : 600 documents synthétiques, leurs résumés de référence écrits à partir des faits saillants, et la table des faits annotés (équipement, symptôme, cause, action, pièce, durée, statut). Un encodeur-décodeur minuscule est entraîné **sur le corpus** — vocabulaire WordPiece et poids appris sur le split d'entraînement, aucun modèle pré-entraîné téléchargé —, puis servi avec un décodage glouton et un budget de longueur déclaré. La baseline extractive et le résumé vide sont mesurés sur les **mêmes lignes de test**, donc chaque score se lit par différence. La couverture des faits saillants et les valeurs non supportées sont publiées à côté du ROUGE : un résumé fluide qui oublie la durée d'une intervention est un mauvais résumé, et il est visible.
#
# Toute la configuration du projet vit dans ce dossier. Aucune valeur métier n'est codée en dur
# dans le code source : chaque paramètre est déclaré ici, typé par `src/schemas/config.py`
# (Pydantic) et surchargeable en ligne de commande par Hydra.
#
#   python -m src.main mode=train ++train.epochs=10 model.params.max_depth=6
#   python -m src.main --multirun data.n_samples=2000,8000
#
# Groupes de configuration (dossier `conf/`) :
#   data/          jeu de données, cibles, split, contrats de validation
#   model/         algorithme et hyperparamètres
#   train/         boucle d'entraînement, callbacks, artefacts produits
#   preprocessing/ nettoyage, encodage, scaling, feature engineering
#   hydra/         répertoires de sortie Hydra (run / sweep)
# =================================================================================================

defaults:
  - data: default
  - model: default
  - train: default
  - preprocessing: default
  - hydra: local
  - _self_

# Mode d'exécution du point d'entrée `src/main.py`.
#   generate-data : génère le jeu de données synthétique dans data/raw
#   train         : entraîne, valide, évalue et sauvegarde les artefacts
#   evaluate      : ré-évalue un modèle existant et régénère les rapports
#   predict       : exécute des prédictions (fichier ou échantillon)
#   all           : generate-data -> train -> evaluate -> predict
mode: train

seed: 42
log_level: INFO
log_file: null            # ex. outputs/run.log ; null = console uniquement

project:
  key: nlp-summarization-seq2seq
  name: resume-comptes-rendus-intervention
  domain: nlp
  problem: summarization
  stack: seq2seq
  family: summarization
  modality: text
  title: "Résumé de comptes-rendus d'intervention — encodeur-décodeur appris, baseline extractive publiée"
  version: 1.0.0

paths:
  root: null              # null -> résolu depuis src/utils/paths.PROJECT_ROOT
  data_dir: null
  artifacts_dir: null
  outputs_dir: null

metrics:
  task: generation
  primary: rouge1_f
  secondary:
    - rouge2_f
    - rouge_l_f
    - fact_coverage
    - fact_precision
    - unsupported_share
    - compression_mean
    - hit_max_length_share
    - n_words_mean
    - latency_p50_ms
    - latency_p95_ms
  baseline: lead
  direction: maximize
  min_primary: 0.45

predict:
  input: null             # chemin d'un fichier (parquet/csv) ou null pour un échantillon
  n_samples: 5
  output: artifacts/reports/predictions.csv

# --- configuration spécifique à la famille `summarization` ----------------------------------
train:
  artifacts:
    model_file: summarizer.pt

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ai-templates"
version = "0.1.0"
description = "Reference templates for data science, data engineering, AI engineering and MLOps"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3,<2",
  "pandas>=2.0,<3",
  "pandera[pandas]>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jupyterlab>=4"]
models = ["scikit-learn>=1.4", "joblib>=1.3"]
all = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "jupyterlab>=4",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]

[tool.setuptools]
py-modules = []

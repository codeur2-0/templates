[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ai-templates-workspace"
version = "1.0.0"
description = "Dépôt de référence : exemples exécutables Data Science, Data Engineering, AI Engineering, MLOps, Analytics, Computer Vision et NLP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Data & AI Platform Team" }]
keywords = ["data-science", "mlops", "ai-engineering", "hydra", "pandera", "templates"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dépendances de l'outillage de génération (tools/scaffold) et de la qualité du dépôt.
# Chaque projet possède son propre pyproject.toml / requirements.txt avec ses dépendances métier.
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "nbformat>=5.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
scaffold = "tools.scaffold.build:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["tools*"]
namespaces = false

# --------------------------------------------------------------------------------------
# Ruff : linter + formatter unique pour tout le dépôt
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["outputs", "multirun", "artifacts", "data", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff specific
]
ignore = [
    "D203", # incompatible avec D211
    "D213", # incompatible avec D212
    "B008", # typer/hydra utilisent des appels de fonction comme valeurs par défaut
    "RUF012", # ClassVar annotées dynamiquement dans certains templates
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D", "E402"]
"tools/scaffold/templates/*" = ["D", "E", "F", "I", "UP", "B", "SIM", "RUF", "N"]
# Le builder de notebooks embarque la prose pédagogique (markdown, insights, explications)
# destinée aux cellules générées : ces chaînes longues ne sont pas du code et leur césure
# nuirait à la lisibilité du texte produit. Les **projets générés**, eux, restent soumis à
# E501 sans exemption (leurs notebooks sont lintés cellule par cellule).
"tools/scaffold/notebooks/tabular.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------------------
# mypy : typage strict progressif
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tools/scaffold/templates", "outputs", "multirun", "artifacts", "\\.venv"]

[[tool.mypy.overrides]]
module = ["pandera.*", "hydra.*", "omegaconf.*", "mlflow.*", "lightgbm.*", "xgboost.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tools"]
pythonpath = ["."]
markers = [
    "slow: tests lents (entraînement complet, notebooks)",
    "integration: tests nécessitant un service externe",
]
